      if (child.type === "description") {
        return `
          <div class="preview-block">
            ${shouldRenderPreviewLabel(child) ? `<div class="tag tag-desc">${escapeHtml(effectiveBlockTitle(child))}</div>` : ""}
            ${child.body ? `<p>${renderTextWithEndingLinks(child.body)}</p>` : ""}
            ${child.body2 ? `<p>${renderTextWithEndingLinks(child.body2)}</p>` : ""}
            ${child.notes ? `<p class="muted preview-child-note">${nl2br(child.notes)}</p>` : ""}
          </div>
        `;
      }

      if (child.type === "skill") {
        ensureSkillState(child);
        const skill = child.skillResults || {};
        return `
          <div class="preview-block">
            ${shouldRenderPreviewLabel(child) ? `<div class="tag tag-skill">${escapeHtml(effectiveBlockTitle(child))}</div>` : ""}
            ${child.body ? `<p>${renderTextWithEndingLinks(child.body)}</p>` : ""}
            <div class="preview-skill-grid">
              ${child.activeSkillResults.includes("success") && skill.success ? `
                <div class="preview-skill-item">
                  <div class="preview-skill-head success">成功</div>
                  <div class="preview-skill-text">${nl2br(skill.success)}</div>
                </div>
              ` : ""}
              ${child.activeSkillResults.includes("failure") && skill.failure ? `
                <div class="preview-skill-item">
                  <div class="preview-skill-head failure">失敗</div>
                  <div class="preview-skill-text">${nl2br(skill.failure)}</div>
                </div>
              ` : ""}
              ${child.activeSkillResults.includes("critical") && skill.critical ? `
                <div class="preview-skill-item">
                  <div class="preview-skill-head critical">クリティカル</div>
                  <div class="preview-skill-text">${nl2br(skill.critical)}</div>
                </div>
              ` : ""}
              ${child.activeSkillResults.includes("fumble") && skill.fumble ? `
                <div class="preview-skill-item">
                  <div class="preview-skill-head fumble">ファンブル</div>
                  <div class="preview-skill-text">${nl2br(skill.fumble)}</div>
                </div>
              ` : ""}
            </div>
            ${child.notes ? `<p class="muted preview-child-note">${nl2br(child.notes)}</p>` : ""}
          </div>
        `;
      }
      if (child.type === "truth") {
        return `
          <div class="preview-block">
            ${shouldRenderPreviewLabel(child) ? `<div class="tag tag-truth">${escapeHtml(effectiveBlockTitle(child))}</div>` : ""}
            ${child.body ? `<blockquote class="preview-blockquote">${renderTextWithEndingLinks(child.body)}</blockquote>` : ""}
            ${child.body2 ? `<p>${renderTextWithEndingLinks(child.body2)}</p>` : ""}
          </div>
        `;
      }

      if (child.type === "character") {
        ensureCharacterEntries(child);
        return `
          <div class="preview-block">
            ${shouldRenderPreviewLabel(child) ? `<div class="tag tag-character">${escapeHtml(effectiveBlockTitle(child))}</div>` : ""}
            ${child.characterEntries.map((entry) => {
              ensureCharacterAttackState(entry);
              return renderPreviewCharacterCard(entry, `
                ${buildCharacterStatusMarkup(entry)}
                ${buildCharacterAttacksMarkup(entry)}
              `);
            }).join("")}
            ${child.notes ? `<p class="muted preview-child-note">${nl2br(child.notes)}</p>` : ""}
          </div>
        `;
      }

      if (child.type === "qa") {
        const qaItems = child.qaItems && child.qaItems.length
          ? child.qaItems
          : [{ q: child.body || "", a: child.body2 || "" }];
        return `
          <div class="preview-block">
            ${shouldRenderPreviewLabel(child) ? `<div class="tag tag-qa">${escapeHtml(effectiveBlockTitle(child))}</div>` : ""}
            <div class="preview-qa-lines">
              ${qaItems.map((item) => `
                <div class="preview-qa-item">
                  ${item.q ? `
                    <div class="preview-qa-row">
                      <div class="preview-qa-mark q">Q</div>
                      <div class="preview-qa-text">${nl2br(item.q)}</div>
                    </div>
                  ` : ""}
                  ${item.a ? `
                    <div class="preview-qa-row">
                      <div class="preview-qa-mark a">A</div>
                      <div class="preview-qa-text">${nl2br(item.a)}</div>
                    </div>
                  ` : ""}
                </div>
              `).join("")}
            </div>
            ${child.notes ? `<p class="muted preview-child-note">${nl2br(child.notes)}</p>` : ""}
          </div>
        `;
      }

      if (child.type === "memo") {
        return `
          <div class="preview-block">
            ${shouldRenderPreviewLabel(child) ? `<div class="tag tag-memo">${escapeHtml(effectiveBlockTitle(child))}</div>` : ""}
            ${child.body ? `<p>${renderTextWithEndingLinks(child.body)}</p>` : ""}
            ${child.body2 ? `<p>${renderTextWithEndingLinks(child.body2)}</p>` : ""}
            ${child.notes ? `<p class="muted preview-child-note">${nl2br(child.notes)}</p>` : ""}
          </div>
        `;
      }

      if (child.type === "quote") {
        const quoteItems = child.quoteItems && child.quoteItems.length
          ? child.quoteItems
          : [{ speakerId: "", speaker: child.title || "", kind: "line", line: child.body || "" }];
        return `
          <div class="preview-block">
            ${shouldRenderPreviewLabel(child) ? `<div class="tag tag-quote">${escapeHtml(effectiveBlockTitle(child))}</div>` : ""}
            <div class="preview-chat-lines">
              ${quoteItems.map((item) => `
                <div class="preview-chat-item">
                  ${speakerLabel(item) ? `<div class="preview-chat-name">${escapeHtml(speakerLabel(item))}</div>` : ""}
                  ${item.line
                    ? (item.kind === "comment"
                        ? `<div class="preview-chat-comment">${nl2br(item.line)}</div>`
                        : `<div class="preview-chat-bubble tone-${quoteToneForSpeaker(item.speakerId, speakerLabel(item))}">${nl2br(item.line)}</div>`)
                    : ""}
                </div>
              `).join("")}
            </div>
            ${child.notes ? `<p class="muted preview-child-note">${nl2br(child.notes)}</p>` : ""}
          </div>
        `;
      }

      if (child.type === "list") {
        const items = renderListItemsMarkup(child);
        return `
          <div class="preview-block">
            ${shouldRenderPreviewLabel(child) ? `<div class="tag tag-memo">${escapeHtml(effectiveBlockTitle(child))}</div>` : ""}
            ${items ? `<div class="preview-list-bullets">${items}</div>` : "<p>箇条書きがまだありません。</p>"}
            ${child.notes ? `<p class="muted preview-child-note">${nl2br(child.notes)}</p>` : ""}
          </div>
        `;
      }

      if (child.type === "choices") {
        const choiceItems = child.choiceItems && child.choiceItems.length
          ? child.choiceItems
          : (child.body
              ? child.body.split("\n").map((line) => ({ text: line, destination: "" }))
              : []);
        return `
          <div class="preview-block">
            ${shouldRenderPreviewLabel(child) ? `<div class="tag tag-choice">${escapeHtml(effectiveBlockTitle(child))}</div>` : ""}
            ${choiceItems.length ? `
              <div class="preview-choice-list">
                ${choiceItems.map((item) => `
                  <div class="preview-choice-item">
                    <button type="button" class="preview-choice-summary">
                      <i class="fa-solid fa-caret-right" aria-hidden="true"></i>${escapeHtml(item.text || "未入力")}
                    </button>
                    <div class="preview-choice-answer">${item.destination ? renderTextWithEndingLinks(item.destination) : "内容がまだありません。"}</div>
                  </div>
                `).join("")}
              </div>
            ` : "<p>選択肢がまだありません。</p>"}
            ${child.notes ? `<p class="muted preview-child-note">${nl2br(child.notes)}</p>` : ""}
          </div>
        `;
      }

      if (child.type === "ending") {
        ensureEndingState(child);
        return `
          <div class="preview-block">
            ${shouldRenderPreviewLabel(child) ? `<div class="tag tag-memo">${escapeHtml(effectiveBlockTitle(child))}</div>` : ""}
            <div class="preview-ending-list">
              ${child.endingItems.map((item, index) => `
                <div class="preview-ending-item" id="${escapeHtml(endingAnchorId(child.id, item.id))}">
                  <div class="preview-ending-title">${escapeHtml(item.title || `END ${index + 1}`)}</div>
                  <div class="preview-ending-body">${item.body ? renderTextWithEndingLinks(item.body) : "内容がまだありません。"}</div>
                </div>
              `).join("")}
            </div>
            ${child.notes ? `<p class="muted preview-child-note">${nl2br(child.notes)}</p>` : ""}
          </div>
        `;
      }

      if (child.type === "explore") {
        const exploreItems = child.exploreItems && child.exploreItems.length
          ? child.exploreItems
          : [];
        return `
          <div class="preview-block">
            ${shouldRenderPreviewLabel(child) ? `<div class="tag tag-explore">${escapeHtml(effectiveBlockTitle(child))}</div>` : ""}
            ${exploreItems.length ? `
              <div class="preview-explore-index" id="explore-index-${escapeHtml(child.id)}">
                <div class="preview-explore-index-title">探索箇所一覧</div>
                <div class="preview-explore-index-list">
                  ${exploreItems.map((item, index) => `
                    <a class="preview-toc-link is-subheading" href="#explore-${escapeHtml(child.id)}-${escapeHtml(item.id)}">${escapeHtml(item.title || `探索箇所${index + 1}`)}</a>
                  `).join("")}
                </div>
              </div>
              <div class="preview-explore-list">
                ${exploreItems.map((item, index) => `
                  <details class="preview-explore-item" id="explore-${escapeHtml(child.id)}-${escapeHtml(item.id)}" open>
                    <summary><h3 class="preview-explore-heading">${escapeHtml(item.title || `探索箇所${index + 1}`)}</h3></summary>
                    <div class="preview-explore-detail-list">
                      ${((item.detailBlocks && item.detailBlocks.length ? item.detailBlocks : [{ type: "text", body: item.detail || "", title: "", kind: "san", collapsed: false }])).map((block) => {
                        if (block.type === "skill") {
                          return `
                            <details class="preview-explore-mini" open>
                              <summary><div class="tag tag-skill">${escapeHtml(block.title || "技能")}</div></summary>
                              ${block.body ? `<p class="preview-explore-detail-text">${renderTextWithEndingLinks(block.body)}</p>` : "<p class=\"preview-explore-detail-text\">内容がまだありません。</p>"}
                            </details>
                          `;
                        }
                        if (block.type === "sancheck") {
                          return `
                            <details class="preview-explore-mini" open>
                              <summary></summary>
                              <div class="preview-sancheck">
                                <span class="tag ${sancheckToneClass(block.kind || "san")}">${escapeHtml(sancheckKindLabel(block.kind || "san"))}：${block.body ? escapeHtml(block.body) : "未入力"}</span>
                              </div>
                            </details>
                          `;
                        }
                        if (block.type === "handout") {
                          const copyText = block.title
                            ? `${block.title}\n${block.body || ""}`.trim()
                            : (block.body || "");
                          return `
                            <details class="preview-explore-mini" open>
                              <summary></summary>
                              <button type="button" class="preview-handout" data-copy-text="${escapeHtml(copyText)}">
                                <div class="preview-handout-head">
                                  <span class="preview-handout-row">
                                    <span class="preview-handout-icon"><i class="${handoutIconClass(block.handoutIcon || "book")}" aria-hidden="true"></i></span>
                                    <span class="preview-handout-title">${escapeHtml(block.title || handoutIconLabel(block.handoutIcon || "book"))}</span>
                                  </span>
                                  <span class="preview-handout-body">${block.body ? nl2br(block.body) : "情報を入力してください。"}</span>
                                </div>
                                <span class="preview-handout-copy" data-copy-feedback>クリックでコピー</span>
                              </button>
                            </details>
                          `;
                        }
                        return `
                          <details class="preview-explore-mini" open>
                            <summary></summary>
                            ${block.body ? `<p class="preview-explore-detail-text">${renderTextWithEndingLinks(block.body)}</p>` : "<p class=\"preview-explore-detail-text\">内容がまだありません。</p>"}
                          </details>
                        `;
                      }).join("") || "<p>詳細がまだありません。</p>"}
                    </div>
                    <div class="preview-backtoc">
                      <a class="preview-toc-link" href="#explore-index-${escapeHtml(child.id)}">探索箇所一覧に戻る</a>
                    </div>
                  </details>
                `).join("")}
              </div>
            ` : "<p>探索箇所がまだありません。</p>"}
            ${child.notes ? `<p class="muted preview-child-note">${nl2br(child.notes)}</p>` : ""}
          </div>
        `;
      }

      if (child.type === "handout") {
        const copyText = child.title
          ? `${child.title}\n${child.body || ""}`.trim()
          : (child.body || "");
        return `
          <div class="preview-block">
            <button type="button" class="preview-handout" data-copy-text="${escapeHtml(copyText)}">
              <div class="preview-handout-head">
                <span class="preview-handout-row">
                <span class="preview-handout-icon"><i class="${handoutIconClass(child.handoutIcon || "book")}" aria-hidden="true"></i></span>
                <span class="preview-handout-title">${escapeHtml(child.title || handoutIconLabel(child.handoutIcon || "book"))}</span>
                </span>
                <span class="preview-handout-body">${child.body ? nl2br(child.body) : "情報を入力してください。"}</span>
              </div>
              <span class="preview-handout-copy" data-copy-feedback>クリックでコピー</span>
            </button>
            ${child.notes ? `<p class="muted preview-child-note">${nl2br(child.notes)}</p>` : ""}
          </div>
        `;
      }

      if (child.type === "secretho") {
        const copyText = child.title
          ? `${child.title}\n${child.body || ""}`.trim()
          : (child.body || "");
        const tabTitle = child.title ? `秘匿HO：${child.title}` : "秘匿HO";
        return `
          <div class="preview-block">
            ${shouldRenderPreviewLabel(child) ? `<div class="tag tag-secretho">${escapeHtml(effectiveBlockTitle(child))}</div>` : ""}
            <button type="button" class="preview-secret-ho ${escapeHtml(child.secretHoTone || "blue")}" data-copy-text="${escapeHtml(copyText)}">
              <span class="preview-secret-ho-tab">${escapeHtml(tabTitle)}</span>
              <div class="preview-secret-ho-body">${child.body ? nl2br(child.body) : "内容を入力してください。"}</div>
              <span class="preview-secret-ho-copy" data-copy-feedback>クリックでコピー</span>
            </button>
            ${child.notes ? `<p class="muted preview-child-note">${nl2br(child.notes)}</p>` : ""}
          </div>
        `;
      }

      return "";
    }

    function isStandalonePreviewChild(type) {
      return type === "toc";
    }

    function renderSectionChildren(children, mode = "preview") {
      const parts = [];
      let grouped = [];

      const flushGrouped = () => {
        if (!grouped.length) return;
        parts.push(`<div class="preview-block-stack">${grouped.map((child) => `<div class="preview-child-anchor" data-preview-child-id="${escapeHtml(child.id)}">${renderChild(child, mode)}</div>`).join("")}</div>`);
        grouped = [];
      };

      children.forEach((child) => {
        if (isStandalonePreviewChild(child.type)) {
          flushGrouped();
          parts.push(`<div class="preview-child-anchor" data-preview-child-id="${escapeHtml(child.id)}">${renderChild(child, mode)}</div>`);
          return;
        }
        grouped.push(child);
      });

      flushGrouped();
      return parts.join("");
    }

    function renderScenarioInfo() {
      const singleRow = (label, value) => {
        if (!value) return "";
        return `
          <div class="scenario-info-row">
            <div class="scenario-info-label">${escapeHtml(label)}</div>
            <div class="scenario-info-value">${escapeHtml(value)}</div>
          </div>
        `;
      };

      const pairRow = (leftLabel, leftValue, rightLabel, rightValue) => {
        if (!leftValue && !rightValue) return "";
        return `
          <div class="scenario-info-pair">
            <div class="scenario-info-label">${escapeHtml(leftLabel)}</div>
            <div class="scenario-info-value">${escapeHtml(leftValue || "")}</div>
            <div class="scenario-info-label">${escapeHtml(rightLabel)}</div>
            <div class="scenario-info-value">${escapeHtml(rightValue || "")}</div>
          </div>
        `;
      };

      const rows = [
        pairRow("シナリオ傾向", state.info.trend, "版", state.info.edition),
        pairRow("プレイ人数", state.info.players, "プレイ時間", state.info.playTime),
        pairRow("秘匿HO", state.info.secretHo, "ロスト率", state.info.lossRate),
        singleRow("探索者について", state.info.explorer),
        singleRow("推奨技能・その他", state.info.recommendedSkill)
      ].filter(Boolean);

      if (!rows.length) return "";

      return `
        <div class="scenario-info-table">
          ${rows.join("")}
        </div>
      `;
    }

    function renderScenarioPrelude() {
      const items = [];
      if (state.prelude.url) {
        items.push(`
          <div class="preview-prelude-item">
            <div class="preview-prelude-item-title">シナリオ配布場所</div>
            <a class="preview-prelude-link" href="${escapeHtml(state.prelude.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(state.prelude.url)}</a>
          </div>
        `);
      }
      if (state.prelude.notice) {
        items.push(`
          <div class="preview-prelude-item">
            <div class="preview-prelude-item-title">事前に伝えたいこと</div>
            <div>${nl2br(state.prelude.notice)}</div>
          </div>
        `);
      }
      if ((state.prelude.npcEntries || []).length) {
        items.push(`
          <div class="preview-prelude-item">
            <div class="preview-prelude-item-title">NPC情報</div>
            ${(state.prelude.npcEntries || []).map((entry) => {
              ensureCharacterAttackState(entry);
              return renderPreviewCharacterCard(entry, `
                ${buildCharacterStatusMarkup(entry)}
                ${buildCharacterAttacksMarkup(entry)}
              `);
            }).join("")}
          </div>
        `);
      }
      if (state.prelude.background) {
        items.push(`
          <div class="preview-prelude-item">
            <div class="preview-prelude-item-title">シナリオ背景</div>
            <div>${nl2br(state.prelude.background)}</div>
          </div>
        `);
      }
      if (state.prelude.afterword) {
        items.push(`
          <div class="preview-prelude-item">
            <div class="preview-prelude-item-title">あとがき</div>
            <div>${nl2br(state.prelude.afterword)}</div>
          </div>
        `);
      }
      (state.prelude.extras || []).forEach((item, index) => {
        if (!item.title && !item.body) return;
        items.push(`
          <div class="preview-prelude-item">
            <div class="preview-prelude-item-title">${escapeHtml(item.title || `追加項目 ${index + 1}`)}</div>
            <div>${item.body ? nl2br(item.body) : ""}</div>
          </div>
        `);
      });

      if (!items.length) return "";

      return `
        <details class="preview-prelude"${state.prelude.collapsed ? "" : " open"}>
          <summary>シナリオを始めるにあたって</summary>
          <div class="preview-prelude-body">
            ${items.join("")}
          </div>
        </details>
      `;
    }

    function renderPreviewCharacterCard(entry, extraHtml = "") {
      return `
        <div class="preview-character-card${entry.imageUrl ? " has-image" : ""}">
          ${entry.imageUrl ? `<img class="preview-character-media" src="${escapeHtml(entry.imageUrl)}" alt="${escapeHtml(entry.name || "character")}">` : ""}
          ${entry.name ? `<div class="preview-character-name">${escapeHtml(entry.name)}</div>` : ""}
          <div class="preview-character-body">
            ${entry.summary ? `<p>${nl2br(entry.summary)}</p>` : ""}
            ${entry.status ? `<div class="preview-character-profile">${nl2br(entry.status)}</div>` : ""}
            ${extraHtml}
          </div>
        </div>
      `;
    }

    function buildCharacterStatusMarkup(entry) {
      const stats = {
        ...createDefaultCharacterStats(),
        ...(entry.characterStats || {})
      };
      const activeKeys = Array.isArray(entry.activeCharacterStats)
        ? entry.activeCharacterStats
        : characterStatOptions.map((item) => item.key).filter((key) => stats[key]);
      const statusItems = activeKeys
        .map((key) => {
          const option = characterStatOptions.find((item) => item.key === key);
          return option ? [option.label, stats[key]] : null;
        })
        .filter(Boolean);
      if (!statusItems.length) return "";
      return `
        <div class="preview-character-stats">
          ${statusItems.map(([label, value]) => `
            <div class="preview-character-stat${["HP", "MP", "SAN値", "DB"].includes(label) ? " danger" : ""}">${escapeHtml(label)}: ${escapeHtml(value || "")}</div>
          `).join("")}
        </div>
      `;
    }

    function buildCharacterAttacksMarkup(entry) {
      if (!Array.isArray(entry.characterAttacks) || !entry.characterAttacks.length) return "";
      return `
        <div class="preview-character-extra">
          ${entry.characterAttacks.map((item) => `
            <div class="preview-character-extra-item">
              <div class="preview-character-skill-line">
                <div class="preview-character-skill-name">${escapeHtml(item.name || "所持技能")}</div>
                <div class="preview-character-skill-value">${item.damage ? `: ${escapeHtml(item.damage)}%` : ""}</div>
              </div>
              ${item.note ? `<div class="preview-character-skill-note">${escapeHtml(item.note)}</div>` : ""}
            </div>
          `).join("")}
        </div>
      `;
    }

    function renderScenarioToc() {
      if (!state.sections.length) return "";

      return `
        <div class="preview-toc" id="scenario-toc">
          <div class="preview-toc-title">目次</div>
          <div class="preview-toc-list">
            ${state.sections.map((section, index) => `
              <a class="preview-toc-link" href="#section-${escapeHtml(section.id)}">${escapeHtml(section.title || `セクション${index + 1}`)}</a>
              ${(section.children || [])
                .filter((child) => child.type === "subheading")
                .map((child, childIndex) => `
                  <a class="preview-toc-link is-subheading" href="#subheading-${escapeHtml(child.id)}">${escapeHtml(child.title || `小見出し${childIndex + 1}`)}</a>
                `).join("")}
            `).join("")}
          </div>
        </div>
      `;
    }

    function renderPreviewOutline() {
      if (!previewOutline) return;
      if (!state.sections.length) {
        previewOutline.innerHTML = "";
        return;
      }

      previewOutline.innerHTML = state.sections.map((section, index) => `
        <a class="preview-outline-link" href="#section-${escapeHtml(section.id)}">${escapeHtml(section.title || `セクション${index + 1}`)}</a>
        ${(section.children || [])
          .filter((child) => child.type === "subheading")
          .map((child, childIndex) => `
            <a class="preview-outline-link is-subheading" href="#subheading-${escapeHtml(child.id)}">${escapeHtml(child.title || `小見出し${childIndex + 1}`)}</a>
          `).join("")}
      `).join("");
    }

    function syncPreviewOutlineToggle() {
      if (!previewOutlineToggle) return;
      const collapsed = document.querySelector(".right")?.classList.contains("outline-collapsed");
      const tooltip = collapsed ? "ナビを開く" : "ナビを閉じる";
      previewOutlineToggle.setAttribute("aria-label", tooltip);
      syncIconButtonTooltip(previewOutlineToggle, tooltip);
      previewOutlineToggle.innerHTML = '<i class="fa-solid fa-bars-staggered" aria-hidden="true"></i><span class="preview-outline-toggle-label">見出しナビ</span>';
    }

    function setDirty(value = true) {
      hasUnsavedChanges = value;
    }

    function scheduleScrollTargets(editorSelector = "", previewSelector = "", options = {}) {
      pendingEditorScrollSelector = editorSelector || "";
      pendingPreviewScrollSelector = previewSelector || "";
      pendingEditorScrollBlock = options.editorBlock || "nearest";
      pendingPreviewScrollBlock = options.previewBlock || "nearest";
      pendingEditorScrollOffset = options.editorOffset || 0;
    }

    function scheduleSectionScroll(sectionId) {
      scheduleScrollTargets(
        `[data-editor-section-id="${sectionId}"]`,
        `#section-${sectionId}`,
        { editorBlock: "start", previewBlock: "start" }
      );
    }

    function scheduleChildScroll(childId) {

        `[data-editor-child-id="${childId}"]`,
        `[data-preview-child-id="${childId}"]`,
        { editorBlock: "center", previewBlock: "center" }
      );
    }

    function scheduleExploreScroll(sectionId, childId, exploreId) {
      scheduleScrollTargets(
        `[data-editor-explore-id="${exploreId}"]`,
        `#explore-${childId}-${exploreId}`,
        { editorBlock: "center", previewBlock: "center" }

        `[data-editor-quote-id="${quoteId}"]`,

    function scheduleNestedScroll(editorSelector, childId) {
      scheduleScrollTargets(
        editorSelector,
        `[data-preview-child-id="${childId}"]`,
        { editorBlock: "start", previewBlock: "center", editorOffset: 120 }
      );

    function schedulePreludeScroll(editorSelector) {
      scheduleScrollTargets(
        editorSelector,
        ".preview-prelude",
        { editorBlock: "start", previewBlock: "center", editorOffset: 120 }
      );
    }

    function applyPendingScroll() {
      if (pendingEditorScrollSelector) {
        const leftPanel = sectionList.closest(".panel.left");
        const editorTarget = leftPanel
          ? leftPanel.querySelector(pendingEditorScrollSelector)
          : sectionList.querySelector(pendingEditorScrollSelector);
        if (editorTarget) {
          if (leftPanel && pendingEditorScrollOffset) {
            const targetTop = editorTarget.getBoundingClientRect().top - leftPanel.getBoundingClientRect().top + leftPanel.scrollTop;
            leftPanel.scrollTo({ top: Math.max(0, targetTop - pendingEditorScrollOffset), behavior: "smooth" });
          } else {
            editorTarget.scrollIntoView({ behavior: "smooth", block: pendingEditorScrollBlock });
          }
        }
      }
      if (pendingPreviewScrollSelector) {
        const previewTarget = preview.querySelector(pendingPreviewScrollSelector);
        if (previewTarget) {
          previewTarget.scrollIntoView({ behavior: "smooth", block: pendingPreviewScrollBlock });
        }
      }
      pendingEditorScrollSelector = "";
      pendingPreviewScrollSelector = "";
      pendingEditorScrollBlock = "nearest";
      pendingPreviewScrollBlock = "nearest";
      pendingEditorScrollOffset = 0;
    }

    (() => {
      const savedWidth = Number.parseInt(localStorage.getItem(LEFT_PANEL_WIDTH_KEY) || "", 10);
      if (Number.isFinite(savedWidth)) {
        setLeftPanelWidth(savedWidth, { persist: false });
      }

      let dragging = false;

      const stopResize = () => {
        if (!dragging) return;
        dragging = false;
        document.body.classList.remove("is-resizing");
      };

      const onPointerMove = (event) => {
        if (!dragging || window.innerWidth <= 1080 || !app) return;
        const appRect = app.getBoundingClientRect();
        const nextWidth = event.clientX - appRect.left;
        setLeftPanelWidth(nextWidth);
      };

      resizeHandle.addEventListener("pointerdown", (event) => {
        if (window.innerWidth <= 1080) return;
        dragging = true;
        document.body.classList.add("is-resizing");
        resizeHandle.setPointerCapture(event.pointerId);
        event.preventDefault();
      });

      resizeHandle.addEventListener("pointermove", onPointerMove);
      resizeHandle.addEventListener("pointerup", stopResize);
      resizeHandle.addEventListener("pointercancel", stopResize);
      window.addEventListener("pointerup", stopResize);
      window.addEventListener("resize", () => {
        const current = Number.parseInt(getComputedStyle(document.documentElement).getPropertyValue("--left-panel-width"), 10);
        if (Number.isFinite(current)) {
          setLeftPanelWidth(current);
        }
      });
    })();

    preview.addEventListener("click", (event) => {
      const link = event.target.closest(".preview-toc-link, .preview-inline-link");
      if (!link) return;
      const href = link.getAttribute("href") || "";
      if (!href.startsWith("#")) return;
      const target = preview.querySelector(href);
      if (!target) return;
      event.preventDefault();
      target.scrollIntoView({ behavior: "smooth", block: "start" });
    });

    function moveItem(array, id, direction) {
      const index = array.findIndex((item) => item.id === id);
      if (index < 0) return;
      const target = direction === "up" ? index - 1 : index + 1;
      if (target < 0 || target >= array.length) return;
      const temp = array[index];
      array[index] = array[target];
      array[target] = temp;
    }

    function clearDragIndicators() {
      sectionList.querySelectorAll(".is-dragging, .drag-over-before, .drag-over-after, .drag-over-container").forEach((element) => {
        element.classList.remove("is-dragging", "drag-over-before", "drag-over-after", "drag-over-container");
      });
    }

    function clearDropIndicators() {
      sectionList.querySelectorAll(".drag-over-before, .drag-over-after, .drag-over-container").forEach((element) => {
        element.classList.remove("drag-over-before", "drag-over-after", "drag-over-container");
      });
    }

    function dropPositionForElement(element, clientY) {
      const rect = element.getBoundingClientRect();
      return clientY < rect.top + rect.height / 2 ? "before" : "after";
    }

    function moveSectionToPosition(sourceSectionId, targetSectionId, position) {
      const sourceIndex = state.sections.findIndex((item) => item.id === sourceSectionId);
      const targetIndexRaw = state.sections.findIndex((item) => item.id === targetSectionId);
      if (sourceIndex < 0 || targetIndexRaw < 0 || sourceIndex === targetIndexRaw) return false;
      const [section] = state.sections.splice(sourceIndex, 1);
      let targetIndex = state.sections.findIndex((item) => item.id === targetSectionId);
      if (targetIndex < 0) {
        state.sections.push(section);
        return true;
      }
      if (position === "after") targetIndex += 1;
      state.sections.splice(targetIndex, 0, section);
      return true;
    }

    function moveChildToPosition(sourceSectionId, childId, targetSectionId, targetChildId = "", position = "end") {
      const sourceSection = findSection(sourceSectionId);
      const targetSection = findSection(targetSectionId);
      if (!sourceSection || !targetSection) return false;
      const sourceIndex = sourceSection.children.findIndex((item) => item.id === childId);
      if (sourceIndex < 0) return false;
      const [child] = sourceSection.children.splice(sourceIndex, 1);
      if (position === "end" || !targetChildId) {
        targetSection.children.push(child);
        return true;
      }
      let targetIndex = targetSection.children.findIndex((item) => item.id === targetChildId);
      if (targetIndex < 0) {
        targetSection.children.push(child);
        return true;
      }
      if (position === "after") targetIndex += 1;
      targetSection.children.splice(targetIndex, 0, child);
      return true;
    }

    function moveItemToPosition(array, sourceId, targetId, position) {
      const sourceIndex = array.findIndex((item) => item.id === sourceId);
      const targetIndexRaw = array.findIndex((item) => item.id === targetId);
      if (sourceIndex < 0 || targetIndexRaw < 0 || sourceId === targetId) return false;
      const [item] = array.splice(sourceIndex, 1);
      let targetIndex = array.findIndex((entry) => entry.id === targetId);
      if (targetIndex < 0) {
        array.push(item);
        return true;
      }
      if (position === "after") targetIndex += 1;
      array.splice(targetIndex, 0, item);
      return true;
    }

    function getNestedDragArray(stateLike) {
      if (!stateLike) return null;
      if (stateLike.type === "qa") {
        const child = findChild(stateLike.sectionId, stateLike.childId);
        return child ? child.qaItems : null;
      }
      if (stateLike.type === "quote") {
        const child = findChild(stateLike.sectionId, stateLike.childId);
        return child ? child.quoteItems : null;
      }
      if (stateLike.type === "choice") {
        const child = findChild(stateLike.sectionId, stateLike.childId);
        return child ? child.choiceItems : null;
      }
      if (stateLike.type === "ending") {
        const child = findChild(stateLike.sectionId, stateLike.childId);
        return child ? child.endingItems : null;
      }
      if (stateLike.type === "explore") {
        const child = findChild(stateLike.sectionId, stateLike.childId);
        return child ? child.exploreItems : null;
      }
      if (stateLike.type === "explore-detail") {
        const explore = findExploreItem(stateLike.sectionId, stateLike.childId, stateLike.exploreId);
        return explore ? explore.detailBlocks : null;
      }
      if (stateLike.type === "character-entry") {
        const child = findChild(stateLike.sectionId, stateLike.childId);
        return child ? child.characterEntries : null;
      }
      if (stateLike.type === "character-attack") {
        const entry = findCharacterEntry(stateLike.sectionId, stateLike.childId, stateLike.entryId);
        return entry ? entry.characterAttacks : null;
      }
      return null;
    }

    function getDragItemId(stateLike) {
      if (!stateLike) return "";
      return stateLike.childIdForNested || stateLike.qaId || stateLike.quoteId || stateLike.choiceId || stateLike.endingId || stateLike.exploreId || stateLike.exploreDetailId || stateLike.entryIdForNested || stateLike.attackId || stateLike.childId || stateLike.sectionId;
    }

    function dragTargetSelector(type) {
      const map = {
        section: ".editor-section",
        child: "[data-editor-child-id]",
        qa: "[data-editor-qa-id]",
        quote: "[data-editor-quote-id]",
        choice: "[data-editor-choice-id]",
        ending: "[data-editor-ending-id]",
        explore: "[data-editor-explore-id]",
        "explore-detail": "[data-editor-explore-detail-id]",
        "character-entry": "[data-editor-character-entry-id]",
        "character-attack": "[data-editor-attack-id]"
      };
      return map[type] || "";
    }

    function dragTargetId(type, element) {
      if (!element) return "";
      const map = {
        section: element.dataset.editorSectionId,
        child: element.dataset.editorChildId,
        qa: element.dataset.editorQaId,
        quote: element.dataset.editorQuoteId,
        choice: element.dataset.editorChoiceId,

      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");

    function syncIconButtonTooltip(button, label) {
      if (!button) return;
      const text = String(label || "").trim();
      if (!text) return;
      button.dataset.tooltip = text;
      button.removeAttribute("title");
    }

    function syncTitleTooltips(root = document) {
      root.querySelectorAll("button[title]").forEach((button) => {
        if (button.dataset.tooltip) {
          button.removeAttribute("title");
          return;
        }
        const label = button.getAttribute("title");
        if (!label) return;
        button.dataset.tooltip = label;
        button.removeAttribute("title");
      });
    }

    function decorateActionButtons(root = document) {
      root.querySelectorAll("button[data-action]").forEach((button) => {
        const action = button.dataset.action || "";
        if (action.startsWith("scroll-to-")) return;

        if (action.endsWith("copy")) {
          button.classList.add("icon-only-button");
          button.setAttribute("aria-label", "複製");
          syncIconButtonTooltip(button, "複製");
          button.innerHTML = '<i class="fa-solid fa-clone" aria-hidden="true"></i>';
          return;
        }

        if (action.endsWith("delete") || action.endsWith("remove") || action.includes("-remove-")) {
          button.classList.add("icon-only-button");
          if (action === "notes-remove") {
            button.classList.add("notes-remove-button");
          }
          button.setAttribute("aria-label", "削除");
          syncIconButtonTooltip(button, "削除");
          button.innerHTML = '<i class="fa-solid fa-trash" aria-hidden="true"></i>';
          return;
        }

        if (action.endsWith("toggle")) {
          const isOpenAction = (button.textContent || "").includes("開く");
          button.classList.add("icon-only-button");
          button.setAttribute("aria-label", isOpenAction ? "開く" : "閉じる");
          syncIconButtonTooltip(button, isOpenAction ? "開く" : "閉じる");
          button.innerHTML = `<i class="fa-solid ${isOpenAction ? "fa-angle-down" : "fa-angle-up"}" aria-hidden="true"></i>`;
        }
      });
      syncTitleTooltips(root);
    }

    .preview-qa-mark.a { background: #eaf2ff; color: #315a8a; }
    .preview-qa-text { padding: 12px 14px; white-space: pre-wrap; }
    .preview-chat-lines { display: grid; gap: 1rem; margin-top: 0; }
    .preview-chat-item { display: grid; gap: 5px; justify-items: start; }
    .preview-chat-name { font-size: .84rem; font-weight: 700; color: #766b63; padding-left: 4px; }
    .preview-chat-bubble { max-width: min(100%, 42rem); padding: 12px 14px; border-radius: 16px 16px 16px 6px; background: #fffdfa; border: 1px solid #eadfd4; white-space: pre-wrap; box-shadow: 0 6px 18px rgba(49, 43, 39, 0.05); }
    .preview-chat-bubble.tone-cream { background: #fffdfa; border-color: #eadfd4; }

    .preview-skill-grid { display: grid; gap: 1rem; margin-top: 0; }
    .preview-skill-base { margin: .2rem 0 .55rem; color: #766b63; font-size: .92rem; font-weight: 700; }
    .preview-skill-item { border: 1px solid #e8ddd1; border-radius: 12px; overflow: hidden; background: #fffdfa; }
    .preview-skill-head { padding: 8px 12px; font-weight: 700; font-size: .9rem; border-bottom: 1px solid #eee4da; }
    .preview-skill-head.success { background: #e6f0ff; color: #345b8a; }
    .preview-skill-head.failure { background: #f8ece6; color: #8a4a34; }
    .preview-skill-head.critical { background: #e8f5ec; color: #2d6a46; }
    .preview-skill-head.fumble { background: #fde8e8; color: #8a3030; }
    .preview-skill-text { padding: 10px 12px 12px; white-space: pre-wrap; }
    hr { width: 22%; min-width: 72px; border: none; border-top: 1px solid #eee7df; margin: .9rem auto; opacity: .9; }
    .preview-divider { display: block; width: 70%; min-width: 96px; height: 2px; margin: .9rem auto; background: #e5ddd4; border-radius: 999px; opacity: 1; }
  </style>
</head>
<body>
  <main>
    <article>
      <h1>${escapeHtml(state.title || "新規シナリオ")}</h1>
      ${renderScenarioInfo()}
      ${renderScenarioPrelude()}
      ${renderScenarioToc()}
      ${state.sections.map((section) => `
        <section id="section-${escapeHtml(section.id)}">
          <h2>${escapeHtml(section.title || "新規セクション")}</h2>
          ${section.notes ? `<p class="muted preview-section-note">${nl2br(section.notes)}</p>` : ""}
          <div class="preview-section-children">${renderSectionChildren(section.children, "export")}</div>
        </section>
      `).join("")}
    </article>
  </main>
  <script>
    async function copyText(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
        return;
      }
      const helper = document.createElement("textarea");
      helper.value = text;
      helper.style.position = "fixed";
      helper.style.opacity = "0";
      document.body.appendChild(helper);
      helper.focus();
      helper.select();
      document.execCommand("copy");
      document.body.removeChild(helper);
    }

    function normalizeOpposedValue(value) {
      return String(value).normalize("NFKC").replace(/[^\\d\\-]/g, "");
    }

    function computeOpposedRoll(active, passive) {
      const activeValue = Number.parseInt(normalizeOpposedValue(active), 10);
      const passiveValue = Number.parseInt(normalizeOpposedValue(passive), 10);
      if (Number.isNaN(activeValue) || Number.isNaN(passiveValue)) return null;
      const raw = 50 + (activeValue - passiveValue) * 5;
      if (raw <= 0) {
        return { value: 0, status: "auto-fail", label: "自動失敗" };
      }
      if (raw >= 99) {
        return { value: 99, status: "auto-success", label: "自動成功" };
      }
      return {
        value: Math.max(5, Math.min(95, raw)),
        status: "normal",
        label: "成功値"
      };
    }

    document.addEventListener("click", async (event) => {
      const link = event.target.closest(".preview-toc-link");
      if (link) {
        const href = link.getAttribute("href") || "";
        if (!href.startsWith("#")) return;
        const target = document.querySelector(href);
        if (!target) return;
        event.preventDefault();
        target.scrollIntoView({ behavior: "smooth", block: "start" });
        return;
      }

      const choiceButton = event.target.closest(".preview-choice-summary");
      if (choiceButton) {
        event.preventDefault();
        const beforeTop = choiceButton.getBoundingClientRect().top;
        const choiceItem = choiceButton.closest(".preview-choice-item");
        if (choiceItem) {
          choiceItem.classList.toggle("is-open");
          requestAnimationFrame(() => {
            const afterTop = choiceButton.getBoundingClientRect().top;
            const delta = afterTop - beforeTop;
            if (Math.abs(delta) > 0.5) {
              window.scrollBy(0, delta);
            }
          });
        }
        return;
      }

      const copyTrigger = event.target.closest("[data-copy-text]");
      if (!copyTrigger) return;
      event.preventDefault();
      await copyText(copyTrigger.dataset.copyText || "");
      const feedback = copyTrigger.querySelector("[data-copy-feedback]");
      if (!feedback) return;
      const previous = feedback.textContent;
      feedback.textContent = "コピーしました";
      window.clearTimeout(copyTrigger._copyFeedbackTimer);
      copyTrigger._copyFeedbackTimer = window.setTimeout(() => {
        feedback.textContent = previous;
      }, 1200);
    });

    document.addEventListener("input", (event) => {
      const input = event.target.closest("[data-preview-opposed]");
      if (!input) return;
      const normalized = normalizeOpposedValue(input.value);
      input.value = normalized;
      const root = input.closest(".preview-block");
      const active = root && root.querySelector('[data-preview-opposed="active"]');
      const passive = root && root.querySelector('[data-preview-opposed="passive"]');
      const result = root && root.querySelector("[data-preview-opposed-result]");
      const label = root && root.querySelector("[data-preview-opposed-label]");
      if (!active || !passive || !result) return;
      const target = computeOpposedRoll(active.value, passive.value);
      const resultWrap = result.closest(".preview-opposed-result");
      if (resultWrap) {
        resultWrap.classList.remove("auto-success", "auto-fail");
        if (target && target.status !== "normal") {
          resultWrap.classList.add(target.status);
        }
      }
      result.textContent = target !== null && target.status === "normal" ? String(target.value) : "";
      if (label) {
        label.textContent = target !== null ? (target.status === "normal" ? "成功値" : (target.label + "！")) : "成功値";
      }
    });
  <\/script>
</body>
</html>`;

      const blob = new Blob([html], { type: "text/html" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = (state.title || "trpg_scenario") + ".html";
      link.click();
      URL.revokeObjectURL(url);
    }

    function scrollEditorToChild(childId) {
      const section = state.sections.find((item) => item.children.some((child) => child.id === childId));
      if (!section) return;
      const child = section.children.find((item) => item.id === childId);
      if (!child) return;
      section.collapsed = false;
      child.collapsed = false;
      renderEditor();
      decorateActionButtons(document);
      requestAnimationFrame(() => {
        const leftPanel = sectionList.closest(".panel.left");
        const target = sectionList.querySelector(`[data-editor-child-id="${childId}"]`);
        if (!leftPanel || !target) return;
        const panelRect = leftPanel.getBoundingClientRect();
        const targetRect = target.getBoundingClientRect();
        const targetTop = targetRect.top - panelRect.top + leftPanel.scrollTop;
        leftPanel.scrollTo({ top: Math.max(0, targetTop - 80), behavior: "smooth" });
      });
    }

    document.getElementById("addSectionButton").addEventListener("click", () => {
      const section = createSection();
      state.sections.push(section);
      setDirty();
      scheduleSectionScroll(section.id);
      renderAll();
    });

    document.getElementById("saveJsonButton").addEventListener("click", saveJson);
    document.getElementById("exportHtmlButton").addEventListener("click", exportHtml);
    document.getElementById("loadJsonButton").addEventListener("click", () => loadJsonInput.click());
    scenarioInfoToggleButton.addEventListener("click", () => {
      state.scenarioInfoCollapsed = !state.scenarioInfoCollapsed;
      setDirty();
      syncScenarioInfoPanel();
    });
    preludeToggleButton.addEventListener("click", () => {
      state.prelude.collapsed = !state.prelude.collapsed;
      setDirty();
      syncPreludePanel();
      renderPreview();
    });
    preludeNpcAddButton.addEventListener("click", () => {
      const newNpc = createPreludeNpcEntry();
      state.prelude.npcEntries.push(newNpc);
      setDirty();
      schedulePreludeScroll(`[data-prelude-npc-entry-id="${newNpc.id}"]`);
      renderAll();
    });
    preludeExtraAddButton.addEventListener("click", () => {
      const newExtra = createPreludeExtraItem();
      state.prelude.extras.push(newExtra);
      setDirty();
      schedulePreludeScroll(`[data-prelude-extra-id="${newExtra.id}"]`);
      renderAll();
    });

    document.getElementById("resetButton").addEventListener("click", () => {
      if (!confirm("入力内容をすべて削除しますか？")) return;
      state.title = "";
      state.info = {
        trend: "",
        edition: "",
        players: "",
        secretHo: "",
        lossRate: "",
        playTime: "",
        explorer: "",
        recommendedSkill: ""
      };
      state.scenarioInfoCollapsed = false;
      state.prelude = {
        url: "",
        notice: "",
        npcEntries: [],
        npcCollapsed: false,
        background: "",
        afterword: "",
        extras: [],
        collapsed: false
      };
      state.sections = [];
      setDirty();
      scenarioTitle.value = "";
      scenarioTrend.value = "";
      scenarioEdition.value = "";
      scenarioPlayers.value = "";
      scenarioSecret.value = "";
      scenarioLoss.value = "";
      scenarioTime.value = "";
      scenarioExplorer.value = "";
      scenarioRecommendedSkill.value = "";
      preludeUrl.value = "";
      preludeNotice.value = "";
      preludeBackground.value = "";
      preludeAfterword.value = "";
      syncScenarioInfoPanel();
      syncPreludePanel();
      renderAll();
    });

    scenarioTitle.addEventListener("input", (event) => {
      state.title = event.target.value;
      setDirty();
      renderPreview();
    });

    [
      [scenarioTrend, "trend"],
      [scenarioEdition, "edition"],
      [scenarioPlayers, "players"],
      [scenarioSecret, "secretHo"],
      [scenarioLoss, "lossRate"],
      [scenarioTime, "playTime"],
      [scenarioExplorer, "explorer"],
      [scenarioRecommendedSkill, "recommendedSkill"]
    ].forEach(([element, key]) => {
      const syncScenarioInfo = (event) => {
        state.info[key] = event.target.value;
        setDirty();
        renderPreview();
      };
      element.addEventListener("input", syncScenarioInfo);
      element.addEventListener("change", syncScenarioInfo);
    });

    [
      [preludeUrl, "url"],
      [preludeNotice, "notice"],
      [preludeBackground, "background"],
      [preludeAfterword, "afterword"]
    ].forEach(([element, key]) => {
      const syncPrelude = (event) => {
        state.prelude[key] = event.target.value;
        setDirty();
        renderPreview();
      };
      element.addEventListener("input", syncPrelude);
      element.addEventListener("change", syncPrelude);
    });

    preludeExtraList.addEventListener("input", (event) => {
      const field = event.target.dataset.preludeExtraField;
      const id = event.target.dataset.preludeExtraId;
      if (!field || !id) return;
      const item = (state.prelude.extras || []).find((extra) => extra.id === id);
      if (!item) return;
      item[field] = event.target.value;
      setDirty();
      renderPreview();
    });

    preludeExtraList.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-action]");
      if (!button) return;
      const id = button.dataset.preludeExtraId;
      const items = state.prelude.extras || [];
      const index = items.findIndex((item) => item.id === id);
      if (index < 0) return;
      setDirty();
      if (button.dataset.action === "prelude-extra-delete") {
        items.splice(index, 1);
      }
      if (button.dataset.action === "prelude-extra-up" && index > 0) {
        [items[index - 1], items[index]] = [items[index], items[index - 1]];
      }
      if (button.dataset.action === "prelude-extra-down" && index < items.length - 1) {
        [items[index + 1], items[index]] = [items[index], items[index + 1]];
      }
      renderAll();
    });

    preludeNpcList.addEventListener("input", (event) => {
      const field = event.target.dataset.preludeNpcField;
      const id = event.target.dataset.preludeNpcId;
      if (!field || !id) return;
      const item = (state.prelude.npcEntries || []).find((npc) => npc.id === id);
      if (!item) return;
      item[field] = event.target.value;
      setDirty();
      renderPreview();
    });

    preludeNpcList.addEventListener("input", (event) => {
      const statKey = event.target.dataset.preludeNpcStat;
      const id = event.target.dataset.preludeNpcId;
      if (!statKey || !id) return;
      const item = (state.prelude.npcEntries || []).find((npc) => npc.id === id);
      if (!item) return;
      item.characterStats = {
        ...createDefaultCharacterStats(),
        ...(item.characterStats || {})
      };
      item.characterStats[statKey] = event.target.value;
      setDirty();
      renderPreview();
    });

    preludeNpcList.addEventListener("input", (event) => {
      const attackField = event.target.dataset.preludeNpcAttackField;
      const id = event.target.dataset.preludeNpcId;
      const attackId = event.target.dataset.attackId;
      if (!attackField || !id || !attackId) return;
      const item = (state.prelude.npcEntries || []).find((npc) => npc.id === id);
      if (!item || !Array.isArray(item.characterAttacks)) return;
      const attack = item.characterAttacks.find((entry) => entry.id === attackId);
      if (!attack) return;
      attack[attackField] = event.target.value;
      setDirty();
      renderPreview();
    });

    preludeNpcList.addEventListener("change", (event) => {
      const input = event.target.closest("input[data-prelude-npc-image-input]");
      if (!input) return;
      const item = (state.prelude.npcEntries || []).find((npc) => npc.id === input.dataset.preludeNpcId);
      const file = input.files && input.files[0];
      if (!item || !file) return;
      readImageFile(file, (dataUrl) => {
        item.imageUrl = dataUrl;
        setDirty();
        renderAll();
      });
      input.value = "";
    });

    preludeNpcList.addEventListener("dragover", (event) => {
      const zone = event.target.closest("[data-dropzone='prelude-npc-image']");
      if (!zone) return;
      event.preventDefault();
      zone.classList.add("dragover");
    });

    preludeNpcList.addEventListener("dragleave", (event) => {
      const zone = event.target.closest("[data-dropzone='prelude-npc-image']");
      if (!zone) return;
      zone.classList.remove("dragover");
    });

    preludeNpcList.addEventListener("drop", (event) => {
      const zone = event.target.closest("[data-dropzone='prelude-npc-image']");
      if (!zone) return;
      event.preventDefault();
      zone.classList.remove("dragover");
      const item = (state.prelude.npcEntries || []).find((npc) => npc.id === zone.dataset.preludeNpcId);
      const file = event.dataTransfer && event.dataTransfer.files && event.dataTransfer.files[0];
      if (!item || !file) return;
      readImageFile(file, (dataUrl) => {
        item.imageUrl = dataUrl;
        setDirty();
        renderAll();
      });
    });

    preludeNpcList.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-action]");
      if (!button) return;
      const id = button.dataset.preludeNpcId;
      const items = state.prelude.npcEntries || [];
      const index = items.findIndex((npc) => npc.id === id);
      if (index < 0) return;

      if (button.dataset.action === "prelude-npc-image-pick") {
        const input = preludeNpcList.querySelector(`input[data-prelude-npc-image-input][data-prelude-npc-id="${id}"]`);
        if (input) input.click();
        return;
      }

      setDirty();
      if (button.dataset.action === "prelude-npc-delete") {
        items.splice(index, 1);
      }
      if (button.dataset.action === "prelude-npc-toggle") {
        items[index].collapsed = !items[index].collapsed;
        schedulePreludeScroll(`[data-prelude-npc-entry-id="${id}"]`);
      }
      if (button.dataset.action === "prelude-npc-up" && index > 0) {
        [items[index - 1], items[index]] = [items[index], items[index - 1]];
      }
      if (button.dataset.action === "prelude-npc-down" && index < items.length - 1) {
        [items[index + 1], items[index]] = [items[index], items[index + 1]];
      }
      if (button.dataset.action === "prelude-npc-stats-toggle") {
        items[index].characterStatsCollapsed = !items[index].characterStatsCollapsed;
        schedulePreludeScroll(`[data-prelude-npc-stats-panel="${id}"]`);
      }
      if (button.dataset.action === "prelude-npc-stat-add") {
        items[index].characterStats = {
          ...createDefaultCharacterStats(),
          ...(items[index].characterStats || {})
        };
        items[index].activeCharacterStats = Array.isArray(items[index].activeCharacterStats) ? items[index].activeCharacterStats : [];
        const key = items[index].characterStatAddType || "str";
        if (!items[index].activeCharacterStats.includes(key)) {
          items[index].activeCharacterStats.push(key);
        }
        const remaining = characterStatOptions.map((item) => item.key).filter((itemKey) => !items[index].activeCharacterStats.includes(itemKey));
        items[index].characterStatAddType = remaining[0] || key;
        schedulePreludeScroll(`[data-prelude-npc-entry-id="${id}"]`);
      }
      if (button.dataset.action === "prelude-npc-stat-remove") {
        items[index].characterStats = {
          ...createDefaultCharacterStats(),
          ...(items[index].characterStats || {})
        };
        items[index].activeCharacterStats = Array.isArray(items[index].activeCharacterStats) ? items[index].activeCharacterStats : [];
        items[index].characterStats[button.dataset.characterStat] = "";
        items[index].activeCharacterStats = items[index].activeCharacterStats.filter((key) => key !== button.dataset.characterStat);
        const remaining = characterStatOptions.map((item) => item.key).filter((itemKey) => !items[index].activeCharacterStats.includes(itemKey));
        items[index].characterStatAddType = remaining[0] || "str";
      }
      if (button.dataset.action === "prelude-npc-image-toggle") {
        items[index].imageCollapsed = !items[index].imageCollapsed;
        schedulePreludeScroll(`[data-prelude-npc-image-panel="${id}"]`);
      }
      if (button.dataset.action === "prelude-npc-attacks-toggle") {
        items[index].characterAttacksCollapsed = !items[index].characterAttacksCollapsed;
        schedulePreludeScroll(`[data-prelude-npc-attacks-panel="${id}"]`);
      }
      if (button.dataset.action === "prelude-npc-attack-add") {
        items[index].characterAttacks = Array.isArray(items[index].characterAttacks) ? items[index].characterAttacks : [];
        const newAttack = createDefaultCharacterAttack();
        items[index].characterAttacks.push(newAttack);
        schedulePreludeScroll(`[data-prelude-npc-attack-id="${newAttack.id}"]`);
      }
      if ((button.dataset.action === "prelude-npc-attack-up" || button.dataset.action === "prelude-npc-attack-down")) {
        items[index].characterAttacks = Array.isArray(items[index].characterAttacks) ? items[index].characterAttacks : [];
        moveItem(items[index].characterAttacks, button.dataset.attackId, button.dataset.action === "prelude-npc-attack-up" ? "up" : "down");
      }
      if (button.dataset.action === "prelude-npc-attack-delete") {
        items[index].characterAttacks = Array.isArray(items[index].characterAttacks) ? items[index].characterAttacks : [];
        items[index].characterAttacks = items[index].characterAttacks.filter((item) => item.id !== button.dataset.attackId);
      }
      if (button.dataset.action === "prelude-npc-image-clear") {
        items[index].imageUrl = "";
      }
      renderAll();
    });

    if (scrollBottomButton) {
      scrollBottomButton.addEventListener("click", () => {
        const leftPanel = scrollBottomButton.closest(".panel.left");
        if (leftPanel) {
          leftPanel.scrollTo({ top: leftPanel.scrollHeight, behavior: "smooth" });
        }
      });
    }

    if (previewOutlineToggle) {
      previewOutlineToggle.addEventListener("click", () => {
        const rightPanel = previewOutlineToggle.closest(".right");
        if (!rightPanel) return;
        rightPanel.classList.toggle("outline-collapsed");
        syncPreviewOutlineToggle();
      });
    }

    sectionList.addEventListener("input", (event) => {
      const speakerId = event.target.dataset.speakerId;
      const sectionId = event.target.dataset.sectionId;
      const childId = event.target.dataset.childId;
      const entryId = event.target.dataset.entryId;
      const characterStat = event.target.dataset.characterStat;
      const attackId = event.target.dataset.attackId;
      const qaId = event.target.dataset.qaId;
      const quoteId = event.target.dataset.quoteId;
      const sectionField = event.target.dataset.sectionField;
      const childField = event.target.dataset.childField;
      const characterEntryField = event.target.dataset.characterEntryField;
      const attackField = event.target.dataset.attackField;
      const qaField = event.target.dataset.qaField;
      const quoteField = event.target.dataset.quoteField;
      const choiceField = event.target.dataset.choiceField;
      const exploreField = event.target.dataset.exploreField;
      const exploreDetailField = event.target.dataset.exploreDetailField;
      const skillField = event.target.dataset.skillField;

      if (speakerId) {
        const speaker = state.speakers.find((item) => item.id === speakerId);
        if (!speaker) return;
        speaker.name = event.target.value;
        setDirty();
        renderPreview();
        return;
      }

      if (sectionField && sectionId) {
        const section = findSection(sectionId);
        if (!section) return;
        section[sectionField] = event.target.value;
        setDirty();
      if (sectionField === "newChildType") {
        renderEditor();
        decorateActionButtons(document);
      } else {
        renderPreview();
      }
        return;
      }

      if (childField && sectionId && childId) {
        const child = findChild(sectionId, childId);
        if (!child) return;
        let nextValue = childField === "showLabel" ? event.target.checked : event.target.value;
        if (child.type === "opposedroll" && (childField === "opposedActive" || childField === "opposedPassive")) {
          nextValue = normalizeOpposedValue(nextValue);
          event.target.value = nextValue;
        }
        child[childField] = nextValue;
        setDirty();
        if (childField === "type") {
          resetChildContentForType(child);
          const fixedTitle = fixedTitleForType(child.type);
          if (fixedTitle !== null) {
            child.title = fixedTitle;
          }
          if (child.type === "qa" && (!child.qaItems || child.qaItems.length === 0)) {
            child.qaItems = createDefaultQaItems();

        requestAnimationFrame(() => renderPreview());
      } catch (error) {
        alert("JSON の読み込みに失敗しました。");
      }
      event.target.value = "";
    });

    scenarioTitle.value = "";
    scenarioTrend.value = "";
    scenarioEdition.value = "";
    scenarioPlayers.value = "";
    scenarioSecret.value = "";
    scenarioLoss.value = "";
    scenarioTime.value = "";
    scenarioExplorer.value = "";
    scenarioRecommendedSkill.value = "";
    preludeUrl.value = "";
    preludeNotice.value = "";
    preludeBackground.value = "";
    preludeAfterword.value = "";
    state.title = scenarioTitle.value;
    state.info.trend = scenarioTrend.value;
    state.info.edition = scenarioEdition.value;
    state.info.players = scenarioPlayers.value;
    state.info.secretHo = scenarioSecret.value;
    state.info.lossRate = scenarioLoss.value;
    state.info.playTime = scenarioTime.value;
    state.info.explorer = scenarioExplorer.value;
    state.info.recommendedSkill = scenarioRecommendedSkill.value;
    syncScenarioInfoPanel();
    syncPreludePanel();
    syncPreludeNpcPanel();
    setDirty(false);
    renderAll();
    requestAnimationFrame(() => renderPreview());
    window.addEventListener("load", () => renderPreview(), { once: true });
  </script>
</body>
</html>
