<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRPGシナリオまとめツール</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    :root {
      --left-panel-width: 620px;
      --bg: #f4efe8;
      --panel: #fffdf9;
      --ink: #312b27;
      --muted: #766b63;
      --line: #e4d9cc;
      --accent: #7c2330;
      --orange-soft: #fbe8d8;
      --blue-soft: #dcecff;
      --green-soft: #e4f3ea;
      --purple-soft: #a5bac5;
      --gray-soft: #f2efea;
      --qa-soft: #fde7d9;
      --shadow: 0 16px 36px rgba(49, 43, 39, 0.08);
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      scroll-behavior: smooth;
      background:
        radial-gradient(circle at top left, rgba(251, 216, 208, 0.6), transparent 28%),
        radial-gradient(circle at bottom right, rgba(221, 236, 255, 0.7), transparent 26%),
        linear-gradient(180deg, #f7f3ed, var(--bg));
      color: var(--ink);
      font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic UI", sans-serif;
    }

    ::selection {
      background: #f3bfd3;
      color: #442135;
    }

    .app {
      display: grid;
      grid-template-columns: var(--left-panel-width) 10px minmax(0, 1fr);
      gap: 16px;
      padding: 20px;
    }

    .resize-handle {
      position: sticky;
      top: 20px;
      align-self: start;
      height: calc(100vh - 40px);
      cursor: col-resize;
      border-radius: 999px;
      background: transparent;
      user-select: none;
      touch-action: none;
    }

    .resize-handle::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 4px;
      height: 72px;
      border-radius: 999px;
      background: #dbcfc4;
      transform: translate(-50%, -50%);
      transition: background-color 140ms ease, transform 140ms ease;
    }

    .resize-handle:hover::before,
    body.is-resizing .resize-handle::before {
      background: #ba9595;
      transform: translate(-50%, -50%) scaleX(1.15);
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .left {
      padding: 18px;
      position: sticky;
      top: 20px;
      align-self: start;
      max-height: calc(100vh - 40px);
      overflow: auto;
    }

    .right {
      padding: 22px;
      min-height: calc(100vh - 40px);
      position: relative;
    }

    .preview-shell {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 148px;
      gap: 18px;
      align-items: start;
      transition: grid-template-columns 200ms ease;
    }

    .right.outline-collapsed .preview-shell {
      grid-template-columns: minmax(0, 1fr) 0;
      gap: 0;
    }

    .preview-outline-toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 10px;
    }

    .preview-outline-intro {
      margin: 0;
      flex: 1 1 auto;
    }

    .preview-outline-toggle {
      display: inline-flex;
      flex-direction: row-reverse;
      align-items: center;
      justify-content: flex-start;
      gap: 0.45rem;
      width: 8.9rem;
      min-width: 8.9rem;
      height: 2.25rem;
      min-height: 2.25rem;
      padding: 0 0.85rem 0 0.42rem;
      border-radius: 999px;
      font-size: 0.82rem;
      overflow: visible;
      white-space: nowrap;
      will-change: width, box-shadow, padding, transform;
      transition:
        width 520ms cubic-bezier(0.2, 0.9, 0.25, 1),
        background-color 140ms ease,
        border-color 140ms ease,
        color 140ms ease,
        box-shadow 360ms ease,
        padding 520ms cubic-bezier(0.2, 0.9, 0.25, 1),
        transform 520ms cubic-bezier(0.2, 0.9, 0.25, 1);
    }

    .preview-outline-toggle .preview-outline-toggle-label {
      max-width: 7rem;
      opacity: 1;
      overflow: hidden;
      transform: translateX(0);
      will-change: max-width, opacity, transform;
      transition:
        max-width 520ms cubic-bezier(0.2, 0.9, 0.25, 1),
        opacity 280ms ease,
        transform 520ms cubic-bezier(0.2, 0.9, 0.25, 1);
    }

    .right.outline-collapsed .preview-outline-toggle {
      width: 2.25rem;
      min-width: 2.25rem;
      padding: 0;
      gap: 0;
      justify-content: center;
      box-shadow: 0 0 0 rgba(64, 86, 110, 0);
    }

    .right.outline-collapsed .preview-outline-toggle .preview-outline-toggle-label {
      max-width: 0;
      opacity: 0;
      transform: translateX(12px) scale(0.92);
    }

    .preview-outline-toggle:hover,
    .preview-outline-toggle:focus-visible {
      box-shadow: 0 10px 26px rgba(64, 86, 110, 0.16);
    }

    .preview-outline-toggle:hover .preview-outline-toggle-label,
    .preview-outline-toggle:focus-visible .preview-outline-toggle-label {
      max-width: 7rem;
      opacity: 1;
      transform: translateX(0);
    }

    .preview-outline {
      position: sticky;
      top: 20px;
      display: grid;
      gap: 6px;
      align-content: start;
      max-height: calc(100vh - 80px);
      overflow: auto;
      padding-top: 4px;
      opacity: 1;
      transform: translateX(0);
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .preview-outline:empty {
      display: none;
    }

    .right.outline-collapsed .preview-outline {
      opacity: 0;
      transform: translateX(14px);
      pointer-events: none;
      overflow: hidden;
    }

    .preview-outline-link {
      display: block;
      padding: 0.2rem 0 0.2rem 0.85rem;
      border-left: 3px solid #d8d0c6;
      color: #8a7d72;
      text-decoration: none;
      font-size: 0.84rem;
      line-height: 1.4;
      transition: border-color 140ms ease, color 140ms ease;
    }

    .preview-outline-link:hover {
      color: #346B8B;
      border-left-color: #346B8B;
    }

    .preview-outline-link.is-subheading {
      margin-left: 0.75rem;
      font-size: 0.78rem;
    }

    body.is-resizing {
      cursor: col-resize;
      user-select: none;
    }

    h1, h2, h3, h4 {
      margin: 0;
      line-height: 1.3;
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 8px;
    }

    h2 {
      font-size: 1.08rem;
      margin-bottom: 12px;
    }

    h3 {
      font-size: 1rem;
      margin-bottom: 8px;
    }

    h4 {
      font-size: 0.95rem;
      margin-bottom: 6px;
    }

    p {
      margin: 0;
      line-height: 1.7;
    }

    .lead,
    .muted {
      color: var(--muted);
    }

    .lead {
      font-size: 0.95rem;
      margin-bottom: 18px;
    }

    .muted {
      font-size: 0.92rem;
    }

    .field {
      margin-bottom: 14px;
    }

    .meta-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .field label {
      display: block;
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--muted);
    }

    .checkbox-row {
      display: flex !important;
      align-items: center;
      column-gap: 10px;
      width: fit-content;
      line-height: 1;
      margin-bottom: 0 !important;
      cursor: pointer;
    }

    .checkbox-row input[type="checkbox"] {
      appearance: none;
      position: relative;
      width: 20px;
      height: 20px;
      margin: 0;
      border: 2px solid #ba9595;
      border-radius: 5px;
      background: transparent;
      cursor: pointer;
      transition: background-color 140ms ease, border-color 140ms ease, transform 140ms ease;
    }

    .checkbox-row input[type="checkbox"]::before {
      content: none;
    }

    .checkbox-row input[type="checkbox"]:checked {
      background: #ba9595;
    }

    .checkbox-row input[type="checkbox"]:checked::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 11px;
      height: 6px;
      border-bottom: 3px solid #ffffff;
      border-left: 2px solid #ffffff;
      transform: rotate(-45deg);
    }

    /* .checkbox-row input[type="checkbox"]:hover {
      transform: translateY(-1px);
    } */

    .checkbox-row input[type="checkbox"]:focus-visible {
      outline: 0;
      box-shadow: 0 0 0 3px rgba(186, 149, 149, 0.18);
    }

    .list-style-options {
      display: flex;
      flex-wrap: nowrap;
      gap: .4rem;
      margin-top: .35rem;
      width: fit-content;
      max-width: 100%;
    }

    .list-style-option {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .35rem;
      padding: .3rem .55rem;
      border: 1px solid #d9ccc4;
      border-radius: 999px;
      background: linear-gradient(180deg, #ffffff 0%, #faf6f1 100%);
      color: #625651;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      width: auto;
      min-width: 0;
      margin-bottom: 0;
      box-shadow: 0 1px 0 rgba(255,255,255,0.9) inset;
      transition: background 180ms ease, border-color 180ms ease, box-shadow 180ms ease, transform 180ms ease, color 180ms ease;
    }

    .list-style-option:hover {
      background: linear-gradient(180deg, #fffdfb 0%, #f7f1eb 100%);
      border-color: #c8b4aa;
      transform: translateY(-1px);
    }

    .list-style-option:focus-within {
      box-shadow: 0 0 0 3px rgba(159, 186, 223, 0.28), 0 1px 0 rgba(255,255,255,0.9) inset;
    }

    .list-style-option:has(input:checked) {
      background: linear-gradient(180deg, #fff7f8 0%, #fceff1 100%);
      border-color: #8a2d2d;
      color: #8a2d2d;
      box-shadow: 0 0 0 3px rgba(138, 45, 45, 0.08), 0 1px 0 rgba(255,255,255,0.85) inset;
    }

    .list-style-option input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
      width: 1px;
      height: 1px;
    }

    .list-style-option-icon {
      min-width: 1rem;
      color: #7f9ab2;
      text-align: center;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .list-style-option-icon i {
      line-height: 1;
    }

    .list-style-option-circle i {
      font-size: 1.08rem;
    }

    .list-style-option-number {
      font-weight: 800;
      font-size: .88rem;
      letter-spacing: 0;
    }

    input[type="text"],
    textarea,
    select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 13px;
      font: inherit;
      color: var(--ink);
      background: #fff;
    }

    input[type="text"]:focus-visible,
    textarea:focus-visible,
    select:focus-visible {
      outline: 0;
      border-color: #9fbadf;
      box-shadow: 0 0 0 3px rgba(159, 186, 223, 0.28);
    }

    textarea {
      min-height: 84px;
      resize: vertical;
      line-height: 1.6;
    }

    .toolbar,
    .section-toolbar,
    .mini-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .toolbar {
      align-items: center;
    }

    #topToolbar > button,
    #topToolbar .toolbar-end-group > button {
      min-height: 42px;
    }

    .toolbar-end-group {
      display: flex;
      gap: 8px;
      margin-left: auto;
      flex: 0 0 auto;
      white-space: nowrap;
    }

    .add-child-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 12px;
      gap: 8px;
    }

    .add-child-main {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1 1 auto;
      min-width: 0;
      flex-wrap: wrap;
    }

    .add-child-row button {
      white-space: nowrap;
    }

    .add-child-row .scroll-top-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 42px;
      padding-left: 10px;
      padding-right: 10px;
      margin-left: auto;
    }

    .toolbar .scroll-bottom-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      min-width: 42px;
      height: 42px;
      padding: 0;
      border-radius: 999px;
      aspect-ratio: 1 / 1;
    }

    #topToolbar .toolbar-icon-button,
    .scroll-icon-button,
    .icon-only-button,
    button[data-tooltip] {
      position: relative;
    }

    #topToolbar .toolbar-icon-button {
      width: 44px;
      min-width: 44px;
      height: 44px;
      min-height: 44px;
      padding: 0;
      border-radius: 999px;
      aspect-ratio: 1 / 1;
    }

    #topToolbar .toolbar-icon-button i {
      font-size: 1.12rem;
      line-height: 1;
      transform-origin: center;
      transition: transform 160ms cubic-bezier(0.2, 0.9, 0.25, 1);
    }

    #topToolbar .toolbar-icon-button:hover i,
    #topToolbar .toolbar-icon-button:focus-visible i {
      transform: scale(1.16);
    }

    #topToolbar .toolbar-icon-button::after,
    .scroll-icon-button::after,
    .icon-only-button::after,
    button[data-tooltip]::after {
      content: attr(data-tooltip);
      position: absolute;
      left: 50%;
      bottom: calc(100% + 8px);
      transform: translate(-50%, 6px) scale(0.98);
      opacity: 0;
      pointer-events: none;
      white-space: nowrap;
      padding: 0.38rem 0.7rem 0.4rem;
      border-radius: 12px;
      background: rgba(97, 103, 108, 0.92);
      color: #fff;
      font-size: 0.75rem;
      line-height: 1;
      box-shadow: 0 8px 18px rgba(49, 43, 39, 0.14);
      transition: opacity 140ms ease, transform 180ms cubic-bezier(0.2, 0.9, 0.25, 1);
      z-index: 20;
    }

    #topToolbar .toolbar-icon-button::before,
    .scroll-icon-button::before,
    .icon-only-button::before,
    button[data-tooltip]::before {
      content: "";
      position: absolute;
      left: 50%;
      bottom: calc(100% + 2px);
      transform: translateX(-50%) translateY(4px);
      opacity: 0;
      pointer-events: none;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 6px solid rgba(97, 103, 108, 0.92);
      transition: opacity 140ms ease, transform 180ms cubic-bezier(0.2, 0.9, 0.25, 1);
      z-index: 19;
    }

    #topToolbar .toolbar-icon-button:hover::after,
    #topToolbar .toolbar-icon-button:focus-visible::after,
    .scroll-icon-button:hover::after,
    .scroll-icon-button:focus-visible::after,
    .icon-only-button:hover::after,
    .icon-only-button:focus-visible::after,
    button[data-tooltip]:hover::after,
    button[data-tooltip]:focus-visible::after {
      opacity: 1;
      transform: translate(-50%, 0) scale(1);
    }

    #topToolbar .toolbar-icon-button:hover::before,
    #topToolbar .toolbar-icon-button:focus-visible::before,
    .scroll-icon-button:hover::before,
    .scroll-icon-button:focus-visible::before,
    .icon-only-button:hover::before,
    .icon-only-button:focus-visible::before,
    button[data-tooltip]:hover::before,
    button[data-tooltip]:focus-visible::before {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .scroll-icon-button {
      transition: color 180ms ease, border-color 180ms ease, background-color 180ms ease;
    }

    .scroll-icon-button i {
      line-height: 1;
    }

    .custom-select {
      position: relative;
      min-width: 0;
    }

    .add-child-row .custom-select {
      width: min(220px, 100%);
      min-width: 220px;
    }

    @media (max-width: 760px) {
      #topToolbar #resetButton {
        order: 10;
        flex-basis: 100%;
        width: fit-content;
      }

      #topToolbar .toolbar-end-group {
        order: 9;
      }
    }

    .custom-select summary {
      list-style: none;
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 42px 12px 13px;
      font: inherit;
      color: var(--ink);
      background: #fff;
      cursor: pointer;
      position: relative;
      user-select: none;
    }

    .custom-select summary::-webkit-details-marker {
      display: none;
    }

    .custom-select summary::after {
      content: "▾";
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 0.9rem;
    }

    .custom-select[open] summary {
      border-bottom-left-radius: 10px;
      border-bottom-right-radius: 10px;
    }

    .custom-select-menu {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      z-index: 30;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fffdf9;
      box-shadow: 0 18px 32px rgba(49, 43, 39, 0.12);
      display: grid;
      gap: 2px;
      max-height: 680px;
      overflow: auto;
    }

    .custom-select.open-up .custom-select-menu {
      top: auto;
      bottom: calc(100% + 6px);
    }

    .custom-select-option {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 9px 10px;
      background: transparent;
      color: var(--ink);
      text-align: left;
      font: inherit;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 140ms ease, color 140ms ease;
    }

    .custom-select-option:hover {
      transform: none;
      background: #f4efe8;
    }

    .custom-select-option.is-selected {
      background: #efe6db;
      color: #7c2330;
      font-weight: 700;
    }

    .custom-select-separator {
      height: 1px;
      margin: 4px 6px;
      background: var(--line);
    }

    .notes-row {
      margin-top: 12px;
    }

    .notes-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 10px;
      margin-bottom: 6px;
    }

    .notes-head label {
      margin: 0;
    }

    .icon-only-button.notes-remove-button {
      width: 30px;
      min-width: 30px;
      height: 30px;
      min-height: 30px;
      padding: 0;
      color: #8a2d2d;
      border-color: #8a2d2d;
      background: transparent;
    }

    .icon-only-button.notes-remove-button:hover {
      color: #fff;
      border-color: #8a2d2d;
      background: #8a2d2d;
    }

    .icon-only-button.notes-remove-button i {
      font-size: 0.84rem;
    }

    .icon-picker {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .icon-picker-button {
      width: 48px;
      height: 48px;
      min-width: 48px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      transition: background-color 140ms ease, border-color 140ms ease, color 140ms ease;
    }

    .icon-picker-button i {
      font-size: 1.35rem;
      line-height: 1;
    }

    .icon-picker-button:hover {
      transform: none;
      background: #eef2f7;
      border-color: #bfd0e7;
      color: #3f5f8a;
    }

    .icon-option {
      width: 48px;
      height: 48px;
      min-width: 48px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      transition: background-color 140ms ease, border-color 140ms ease, color 140ms ease;
    }

    .icon-option i {
      font-size: 1.35rem;
      line-height: 1;
    }

    .icon-option:hover {
      transform: none;
      background: #eef2f7;
      border-color: #bfd0e7;
      color: #3f5f8a;
    }

    .icon-option.is-selected {
      background: #3f5f8a;
      border-color: #3f5f8a;
      color: #fff;
    }

    .icon-picker-button.is-selected {
      background: #f8fbff;
      border-color: #bfd0e7;
      color: #3f5f8a;
    }

    .speaker-panel {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    .speaker-list {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }

    .speaker-item {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fcfbf8;
    }

    .speaker-chip {
      width: 14px;
      height: 14px;
      border-radius: 999px;
      border: 1px solid rgba(49, 43, 39, 0.14);
    }

    .speaker-select-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
    }

    button {
      border: 2px solid transparent;
      border-radius: 999px;
      padding: 10px 14px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 180ms ease, color 180ms ease, border-color 180ms ease, opacity 140ms ease;
    }

    button:hover {
      transform: none;
    }

    .primary {
      background: transparent;
      color: #7a2632;

    .preview-explore-mini {
      padding: 0.45rem 0;
      border-radius: 0;
      border: 0;
      background: transparent;
    }

    .preview-explore-mini + .preview-explore-mini {
      margin-top: 0;
    }

    .fa-solid,
    .fa-regular {
      display: inline-block;
      line-height: 1;
    }

    .icon-only-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 35px;
      min-width: 35px;
      height: 35px;
      padding: 0;
      border-radius: 999px;
      aspect-ratio: 1 / 1;
    }

    .preview-blockquote {
      margin: 0;
      padding: 0.9rem 1rem;
      border-left: 4px solid #848484;
      background: #fffdfa;
      white-space: pre-wrap;
    }

    .preview-scenechange {
      margin: 0.15rem 0;
      margin-left: 1rem;
      margin-right: 1rem;
      display: block;
      width: fit-content;
      max-width: calc(100% - 2rem);
      padding: 0.5rem 1rem 0.5rem 0.7rem;
      background: #abbbc5;
      border-left: 5px solid #627079;
      white-space: pre-wrap;
      font-weight: 500;
      color: #fff;
      box-shadow: 3px 3px 3px #00000017;
      font-size: 0.9rem;
    }

    .preview-sancheck {
      margin-top: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
    }

    .preview-sancheck .tag {
      margin-bottom: 0;
    }

    .preview-opposed {
      margin-top: 0;
      display: grid;
      gap: 1rem;
    }

    .preview-opposed-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .preview-opposed-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      border: 1px solid #d9e3f3;
      border-radius: 999px;
      background: #f8fbff;
      padding: 0.45rem 0.75rem;
      font-weight: 700;
      color: #365884;
    }

    .preview-opposed-separator {
      color: #8aa0be;
      font-weight: 500;
      margin: 0 0.1rem;
    }

    .preview-opposed-chip input {
      width: 4.5rem;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      font-weight: 700;
      padding: 0;
      outline: none;
      text-align: center;
    }

    .preview-opposed-result {
      display: inline-flex;
      align-items: baseline;
      gap: 0.5rem;
      padding: 0 0.25rem;
      color: #365884;
    }

    .preview-opposed-result strong {
      font-size: 1.3rem;
      line-height: 1;
    }

    .preview-opposed-result.auto-success {
      color: #2d5f9a;
    }

    .preview-opposed-result.auto-fail {
      color: #b24040;
    }

    .preview-choice-list {
      margin-top: 1rem;
      display: grid;
      gap: 1rem;
    }

    .preview-choice-item {
      border: 1px solid #dfe8dc;
      border-radius: 14px;
      background: #fcfefb;
      overflow: hidden;
    }

    .preview-choice-summary {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      width: 100%;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
      padding: 12px 14px;
      font-weight: 700;
      font-size: 1rem;
      position: relative;
      text-align: left;
    }

    .preview-choice-summary i {
      color: #486149;
      transition: transform 160ms ease;
    }

    .preview-choice-item.is-open .preview-choice-summary i {
      transform: rotate(90deg);
    }

    .preview-choice-answer {
      display: none;
      padding: 0 14px 14px 30px;
      white-space: pre-wrap;
    }

    .preview-choice-item.is-open .preview-choice-answer {
      display: block;
    }

    .preview-list-bullets {
      margin: 0 1rem;
      display: grid;
      gap: 0.7rem;
    }

    .preview-list-item {
      display: grid;
      grid-template-columns: 1.2rem minmax(0, 1fr);
      column-gap: 0.4rem;
      align-items: baseline;
    }

    .preview-list-marker {
      width: 1.2rem;
      min-width: 1.2rem;
      display: inline-flex;
      align-items: baseline;
      justify-content: center;
      line-height: 1;
      text-align: center;
    }

    .preview-list-marker i {
      line-height: 1;
    }

    .preview-list-check {
      color: #7f9ab2;
      font-size: 0.82rem;
      transform: translateY(0.04rem);
    }

    .preview-list-circle {
      color: #7f9ab2;
      font-size: 0.94rem;
      transform: translateY(0.03rem);
    }

    .preview-list-number {
      color: #7f9ab2;
      font-size: 0.98rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      transform: translateY(0.02rem);
    }

    .preview-list-text {
      white-space: pre-wrap;
      display: block;
    }

    .preview-handout {
      margin-top: 0;
      width: calc(100% - 2rem);
      box-sizing: border-box;
      border: 1px solid #bfd0e7;
      border-radius: 16px;
      background: #f8fbff;
      padding: 14px 16px;
      text-align: left;
      color: var(--ink);
      cursor: pointer;
      transition: background-color 140ms ease, border-color 140ms ease;
      position: relative;
    }

    .preview-handout-head {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      color: #3f5f8a;
      padding-right: 120px;
    }

    .preview-handout-row {
      display: grid;
      grid-template-columns: 1.4rem minmax(0, 1fr);
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .preview-handout-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.4rem;
      min-width: 1.4rem;
      vertical-align: middle;
    }

    .preview-handout-title {
      font-size: 1rem;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      line-height: 1;
      vertical-align: middle;
      transform: translateY(-1px);
    }

    .preview-handout-body {
      display: block;
      font-weight: 400;
      color: var(--ink);
      white-space: pre-wrap;
      padding-left: calc(1.4rem + 10px);
    }

    .preview-handout:hover {
      transform: none;
      background: #f1f7ff;
      border-color: #9fbadf;
    }

    .preview-handout-copy {
      display: inline-block;
      position: absolute;
      top: 14px;
      right: 16px;
      font-size: 0.84rem;
      font-weight: 700;
      color: #3f5f8a;
    }

    .preview-explore-detail-list .preview-handout {
      width: 100%;
      margin-left: 0;
      margin-right: 0;
    }

    .preview-secret-ho {
      position: relative;
      margin-top: 1.7rem;
      width: calc(100% - 2rem);
      box-sizing: border-box;
      padding: 1.05rem 1rem 0.95rem;
      border-radius: 0 16px 16px 16px;
      text-align: left;
      cursor: pointer;
      border: 2px solid var(--folder-border, #7f9bb2);
      background: var(--folder-bg, #eef5fb);
      color: var(--folder-text, #31516a);
      box-shadow: 0 6px 16px rgba(49, 43, 39, 0.06);
    }

    .preview-secret-ho-tab {
      position: absolute;
      top: -30px;
      left: -2px;
      display: inline-flex;
      align-items: center;
      max-width: calc(100% - 3.4rem);
      min-height: 25px;
      padding: 0.26rem 0.9rem 0.18rem;
      border: 2px solid var(--folder-border, #7f9bb2);
      border-bottom: 0;
      border-radius: 12px 12px 0 0;
      background: var(--folder-tab, #dbe9f4);
      font-size: 0.92rem;
      font-weight: 800;
      color: var(--folder-text, #31516a);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .preview-secret-ho.blue { --folder-bg: #eef5fb; --folder-tab: #dceaf5; --folder-border: #7b9ab2; --folder-text: #31516a; }
    .preview-secret-ho.pink { --folder-bg: #fbf0f5; --folder-tab: #f4dfe9; --folder-border: #b7869f; --folder-text: #7f5367; }
    .preview-secret-ho.green { --folder-bg: #eff8f1; --folder-tab: #dceddf; --folder-border: #7ea287; --folder-text: #40624b; }
    .preview-secret-ho.amber { --folder-bg: #fdf6eb; --folder-tab: #f7e4c7; --folder-border: #c8a468; --folder-text: #7e6130; }
    .preview-secret-ho.purple { --folder-bg: #f3effb; --folder-tab: #e4ddf6; --folder-border: #9786bf; --folder-text: #5d4f86; }

    .preview-secret-ho-body {
      white-space: pre-wrap;
    }

    .preview-secret-ho-copy {
      position: absolute;
      top: 12px;
      right: 14px;
      font-size: 0.82rem;
      font-weight: 700;
      opacity: 0.82;
    }

    .preview-qa-lines p + p {
      margin-top: 0.55rem;
    }

    .preview-character-card {
      margin-top: 1rem;
      border: 1px solid #e7ddd1;
      border-radius: 14px;
      background: #fffdfa;
      overflow: hidden;
    }

    .preview-character-card.has-image {
      display: grid;
      grid-template-columns: minmax(0, 1fr) clamp(116px, 22vw, 170px);
      align-items: stretch;
    }

    .preview-character-media {
      width: 100%;
      height: auto;
      object-fit: cover;
      display: block;
      border-bottom: 1px solid #e7ddd1;
      background: #f4efe8;
    }

    .preview-character-card.has-image .preview-character-media {
      grid-column: 2;
      grid-row: 1 / span 2;
      width: 100%;
      height: 100%;
      border-bottom: 0;
      border-left: 1px solid #e7ddd1;
      border-right: 0;
    }

    .preview-character-name {
      padding: 10px 14px;
      font-weight: 700;
      background: var(--gray-soft);
      border-bottom: 1px solid #e7ddd1;
    }

    .preview-character-card.has-image .preview-character-name,
    .preview-character-card.has-image .preview-character-body {
      grid-column: 1;
    }

    .preview-character-body {
      padding: 12px 14px 14px;
    }

    .preview-character-profile {
      margin-top: 0.65rem;
      color: #766b63;
      font-size: 0.92rem;
      font-weight: 700;
      white-space: pre-wrap;
    }

    .preview-character-body p + p {
      margin-top: 0.45rem;
    }

    .preview-character-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 0.85rem;
    }

    .preview-character-stat {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      border: 1px solid #e7ddd1;
      border-radius: 999px;
      background: #fff;
      padding: 6px 10px;
      font-size: 0.88rem;
      font-weight: 700;
    }

    .preview-character-stat.danger {
      color: #9b2f3b;
      border-color: #e8c9cf;
      background: #fff6f7;
    }

    .preview-character-extra {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 0.85rem;
    }

    .preview-character-extra-item {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) auto;
      gap: 6px 10px;
      align-items: center;
      padding: 10px 12px;
      border-radius: 12px;
      background: #f8f3ed;
      border: 1px solid #e7ddd1;
    }

    .preview-character-skill-name {
      font-weight: 800;
      white-space: nowrap;
    }

    .preview-character-skill-value {
      font-weight: 700;
      color: var(--muted);
      white-space: pre-wrap;
    }

    .preview-character-skill-line {
      display: flex;
      align-items: baseline;
      gap: 0.35rem;
      white-space: nowrap;
    }

    .preview-character-skill-note {
      color: var(--muted);
      white-space: nowrap;
      text-align: right;
    }

    .preview-qa-item {
      margin-top: 1rem;
      border: 1px solid #eadfd4;
      border-radius: 14px;
      overflow: hidden;
      background: #fffdfa;
    }

    .preview-qa-row {
      display: grid;
      grid-template-columns: 56px 1fr;
      gap: 0;
    }

    .preview-qa-row + .preview-qa-row {
      border-top: 1px solid #eee4da;
    }

    .preview-qa-mark {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 12px 10px;
      font-weight: 800;
      font-size: 0.92rem;
    }

    .preview-qa-mark.q {
      background: #f9ebe4;
      color: #8a3e2c;
    }

    .preview-qa-mark.a {
      background: #eaf2ff;
      color: #315a8a;
    }

    .preview-qa-text {
      padding: 12px 14px;
      white-space: pre-wrap;
    }

    .preview-chat-lines {
      display: grid;
      gap: 1rem;
      margin-top: 0;
    }

    .preview-chat-item {
      display: grid;
      gap: 5px;
      justify-items: start;
    }

    .preview-chat-name {
      font-size: .84rem;
      font-weight: 700;
      color: var(--muted);
      padding-left: 4px;
    }

    .preview-chat-bubble {
      max-width: min(100%, 42rem);
      padding: 12px 14px;
      border-radius: 16px 16px 16px 6px;
      background: #fffdfa;
      border: 1px solid #eadfd4;
      white-space: pre-wrap;
      box-shadow: 0 6px 18px rgba(49, 43, 39, 0.05);
    }

    .preview-chat-bubble.tone-cream {
      background: #fffdfa;
      border-color: #eadfd4;
    }

    .preview-chat-bubble.tone-rose {
      background: #fdf0ea;
      border-color: #ebd4c8;
    }

    .preview-chat-bubble.tone-blue {
      background: #edf5ff;
      border-color: #d5e4f8;
    }

    .preview-chat-bubble.tone-green {
      background: #edf8f0;
      border-color: #d6e9d9;
    }

    .preview-chat-bubble.tone-gray {
      background: #f3f1ee;
      border-color: #ddd7d0;
    }

    .preview-chat-comment {
      max-width: min(100%, 42rem);
      padding: 0.15rem 0.2rem 0.15rem 0.3rem;
      color: var(--muted);
      white-space: pre-wrap;
      font-size: 0.94rem;
    }

    .preview-skill-base {
      margin: 0.2rem 0 0.55rem;
      color: var(--muted);
      font-size: 0.92rem;
      font-weight: 700;
    }

    .preview-skill-grid {
      display: grid;
      gap: 1rem;
      margin-top: 0;
    }

    .preview-skill-item {
      border: 1px solid #e8ddd1;
      border-radius: 12px;
      overflow: hidden;
      background: #fffdfa;
    }

    .preview-skill-head {
      padding: 8px 12px;
      font-weight: 700;
      font-size: 0.9rem;
      border-bottom: 1px solid #eee4da;
    }

    .preview-skill-head.success { background: #e6f0ff; color: #345b8a; }
    .preview-skill-head.failure { background: #f8ece6; color: #8a4a34; }
    .preview-skill-head.critical { background: #e8f5ec; color: #2d6a46; }
    .preview-skill-head.fumble { background: #fde8e8; color: #8a3030; }

    .preview-skill-text {
      padding: 10px 12px 12px;
      white-space: pre-wrap;
    }

    .empty {
      border: 1px dashed var(--line);
      border-radius: 16px;
      padding: 18px;
      margin-top: 1rem;
      color: var(--muted);
      background: #fffcf8;
    }

    .section-list > .empty {
      margin-top: 0;
    }

    .children > .empty {
      margin-top: 0;
    }

    @media (max-width: 1080px) {
      .app {
        grid-template-columns: 1fr;
      }

      .resize-handle {
        display: none;
      }

      .left {
        position: static;
        max-height: none;
        overflow: visible;
      }

      .preview-shell {
        grid-template-columns: 1fr;
      }

      .preview-outline {
        display: none;
      }

      .preview-outline-toggle-row {
        display: none;
      }

      .scenario-info-pair {
        grid-template-columns: 168px minmax(0, 1fr);
      }

      .scenario-info-pair .scenario-info-label:nth-of-type(2) {
        border-left: 0;
      }

      .scenario-info-pair .scenario-info-label:nth-of-type(2),
      .scenario-info-pair .scenario-info-value:nth-of-type(2) {
        border-top: 1px solid #ece3d8;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="panel left">
      <h1>TRPGのシナリオまとめがほしいんだ🦈</h1>
      <p class="lead">各セクションを積み上げて行ってシナリオをみやすくしよ～ぜ</p>

      <div class="editor-section">
        <div class="section-head">
          <div class="section-title">シナリオ概要</div>
          <div class="mini-buttons">
            <button class="secondary" id="scenarioInfoToggleButton">閉じる</button>
          </div>
        </div>

        <div id="scenarioInfoBody">
          <div class="field">
            <label for="scenarioTitle">シナリオタイトル</label>
            <input id="scenarioTitle" type="text" placeholder="新規シナリオ">
          </div>

          <div class="meta-row">
            <div class="field">
              <label for="scenarioTrend">シナリオ傾向</label>
              <input id="scenarioTrend" type="text" placeholder="例：現代日本 / クローズド">
            </div>

            <div class="field">
              <label for="scenarioEdition">版</label>
              <select id="scenarioEdition">
                <option value=""></option>
                <option value="6版">6版</option>
                <option value="7版">7版</option>
              </select>
            </div>
          </div>

          <div class="meta-row">
            <div class="field">
              <label for="scenarioPlayers">プレイ人数</label>
              <input id="scenarioPlayers" type="text" placeholder="例：ソロ / 4人固定">
            </div>

            <div class="field">
              <label for="scenarioTime">プレイ時間</label>
              <input id="scenarioTime" type="text" placeholder="例：2時間 / 3-4時間">
            </div>
          </div>

          <div class="meta-row">
            <div class="field">
              <label for="scenarioSecret">秘匿HO</label>
              <select id="scenarioSecret">
                <option value=""></option>
                <option value="あり">あり</option>
                <option value="なし">なし</option>
              </select>
            </div>

            <div class="field">
              <label for="scenarioLoss">ロスト率</label>
              <input id="scenarioLoss" type="text" placeholder="例：低 / 後遺症あり">
            </div>
          </div>

          <div class="field">
            <label for="scenarioExplorer">探索者について</label>
            <input id="scenarioExplorer" type="text" placeholder="例：新規限定 / 継続可 / 事前関係あり">
          </div>

          <div class="field">
            <label for="scenarioRecommendedSkill">推奨技能・その他</label>
            <input id="scenarioRecommendedSkill" type="text" placeholder="例：目星 / 図書館 / 聞き耳">
          </div>
        </div>
      </div>

      <div class="editor-section">
        <div class="section-head">
          <div class="section-title">シナリオを始めるにあたって</div>
          <div class="mini-buttons">
            <button class="secondary" id="preludeToggleButton">閉じる</button>
          </div>
        </div>

        <div id="preludeBody">
          <div class="field">
            <label for="preludeUrl">シナリオ配布場所</label>
            <input id="preludeUrl" type="text" placeholder="URLを貼る">
          </div>

          <div class="field">
            <label for="preludeNotice">事前に伝えたいこと</label>
            <textarea id="preludeNotice" placeholder="事前説明や注意事項"></textarea>
          </div>

          <div class="editor-block collapsible-editor-panel" id="preludeNpcPanel">
            <div class="section-head mb-12">
              <div class="section-title">NPC情報</div>
              <div class="mini-buttons">
                <button class="secondary" type="button" id="preludeNpcAddButton">追加</button>
              </div>
            </div>
            <div id="preludeNpcBody">
              <div id="preludeNpcList" class="character-grid"></div>
            </div>
          </div>

          <div class="field" style="margin-top: 0.7rem;">
            <label for="preludeBackground">シナリオ背景</label>
            <textarea id="preludeBackground" placeholder="背景や導入前提"></textarea>
          </div>

          <div class="field">
            <label for="preludeAfterword">あとがき</label>
            <textarea id="preludeAfterword" placeholder="あとがきや補足"></textarea>
          </div>

          <div class="editor-block" data-prelude-extra-id="${item.id}">
            <div class="section-head mb-12">
              <div class="section-title">追加項目</div>
              <div class="mini-buttons">
                <button class="secondary" type="button" id="preludeExtraAddButton">追加</button>
              </div>
            </div>
            <div id="preludeExtraList" class="qa-grid"></div>
          </div>
        </div>
      </div>

      <div class="toolbar" id="topToolbar">
        <button class="primary" id="addSectionButton">セクション追加</button>
        <button class="secondary toolbar-icon-button" id="saveJsonButton" type="button" aria-label="保存" data-tooltip="保存">
          <i class="fa-solid fa-floppy-disk" aria-hidden="true"></i>
        </button>
        <button class="secondary toolbar-icon-button" id="loadJsonButton" type="button" aria-label="読込" data-tooltip="読込">
          <i class="fa-solid fa-file-import" aria-hidden="true"></i>
        </button>
        <button class="secondary toolbar-icon-button" id="exportHtmlButton" type="button" aria-label="HTML保存" data-tooltip="HTML保存">
          <i class="fa-solid fa-file-code" aria-hidden="true"></i>
        </button>
        <button class="danger" id="resetButton">全体クリア</button>
        <div class="toolbar-end-group">
          <button class="secondary scroll-bottom-button scroll-icon-button" id="scrollBottomButton" type="button" aria-label="一番下へ" data-tooltip="一番下へ">
            <i class="fa-solid fa-arrow-down" aria-hidden="true"></i>
          </button>
        </div>
      </div>

      <input id="loadJsonInput" type="file" accept=".json,application/json" hidden>

      <div class="section-list" id="sectionList"></div>

    function quoteToneForSpeaker(speakerId, speakerName = "") {
      if (speakerId) {

      return quoteToneCycle[sum % quoteToneCycle.length];

      if (type === "skill" || type === "scene" || type === "prose" || type === "scenechange" || type === "memo") return "medium";
      if (type === "list" || type === "choices" || type === "explore") return "medium";

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function sanitizeSancheckValue(value) {
      return String(value)
        .normalize("NFKC")
        .replace(/\s+/g, "")
        .replace(/[^A-Za-z0-9\/+\-]/g, "");
    }

    function normalizeOpposedValue(value) {
      return String(value).normalize("NFKC").replace(/[^\d\-]/g, "");
    }

    function computeOpposedRoll(active, passive) {
      const activeValue = Number.parseInt(normalizeOpposedValue(active), 10);
      const passiveValue = Number.parseInt(normalizeOpposedValue(passive), 10);
      if (Number.isNaN(activeValue) || Number.isNaN(passiveValue)) return null;
      const raw = 50 + (activeValue - passiveValue) * 5;
      if (raw <= 0) {
        return { value: 0, status: "auto-fail", label: "自動失敗" };
      }
      if (raw >= 99) {
        return { value: 99, status: "auto-success", label: "自動成功" };
      }
      return {
        value: Math.max(5, Math.min(95, raw)),
        status: "normal",
        label: "成功値"
      };
    }

    function nl2br(text) {
      return escapeHtml(text).replace(/\n/g, "<br>");
    }

    function findEndingTargetByTitle(title) {
      const normalized = String(title || "").trim();
      if (!normalized) return null;
      for (const section of state.sections) {
        for (const child of section.children) {
          if (child.type !== "ending" || !Array.isArray(child.endingItems)) continue;
          const found = child.endingItems.find((item) => String(item.title || "").trim() === normalized);
          if (found) {
            return { childId: child.id, itemId: found.id, title: normalized };
          }
        }
      }
      return null;
    }

    function endingAnchorId(childId, itemId) {
      return `ending-${childId}-${itemId}`;
    }

    function renderTextWithEndingLinks(text) {
      const source = String(text || "");
      if (!source) return "";
      const parts = source.split(/(\[\[[^[\]]+\]\])/g);
      return parts.map((part) => {
        const match = part.match(/^\[\[([^[\]]+)\]\]$/);
        if (!match) return escapeHtml(part);
        const target = findEndingTargetByTitle(match[1]);
        if (!target) return escapeHtml(part);
        return `<a class="preview-inline-link" href="#${escapeHtml(endingAnchorId(target.childId, target.itemId))}">${escapeHtml(target.title)}</a>`;
      }).join("").replace(/\n/g, "<br>");
    }

    function getListEntries(child) {
      return String(child.body || "")
        .split("\n")
        .map((item) => item.trim())
        .filter(Boolean);
    }

    function listMarkerClass(listStyle) {
      if (listStyle === "circle" || listStyle === "dot") return "circle";
      if (listStyle === "number") return "number";
      return "check";
    }

    function renderListMarker(listStyle, index) {
      if (listStyle === "circle" || listStyle === "dot") {
        return '<span class="preview-list-marker" aria-hidden="true"><i class="fa-regular fa-circle preview-list-circle"></i></span>';
      }
      if (listStyle === "number") {
        return `<span class="preview-list-marker preview-list-number" aria-hidden="true">${index + 1}）</span>`;
      }
      return '<span class="preview-list-marker" aria-hidden="true"><i class="fa-solid fa-check preview-list-check"></i></span>';
    }

    function renderListItemsMarkup(child) {
      const listStyle = child.listStyle || "check";
      const entries = getListEntries(child);
      if (!entries.length) return "";
      return entries.map((item, index) => `
        <div class="preview-list-item preview-list-item-${listMarkerClass(listStyle)}">
          ${renderListMarker(listStyle, index)}
          <span class="preview-list-text">${renderTextWithEndingLinks(item)}</span>
        </div>
      `).join("");
    }

    async function copyToClipboard(text) {
      const value = String(text || "");
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(value);
        return;
      }

      const helper = document.createElement("textarea");
      helper.value = value;
      helper.style.position = "fixed";
      helper.style.opacity = "0";
      document.body.appendChild(helper);
      helper.focus();
      helper.select();
      document.execCommand("copy");
      document.body.removeChild(helper);
    }

    function flashCopyFeedback(element) {
      if (!element) return;
      const marker = element.querySelector("[data-copy-feedback]");
      if (!marker) return;
      const previous = marker.textContent;
      marker.textContent = "コピーしました";
      window.clearTimeout(element._copyFeedbackTimer);
      element._copyFeedbackTimer = window.setTimeout(() => {
        marker.textContent = previous;
      }, 1200);
    }

    function childTypeLabel(type) {
      const found = childTypeOptions.find((item) => item.value === type);
      return found ? found.label : type;
    }

    function renderChildTypePicker({ selectedValue, sectionId, childId = "" }) {
      const selectedLabel = childTypeLabel(selectedValue || "description");
      const action = childId ? "set-child-type" : "set-new-child-type";
      const attr = childId ? ` data-child-id="${childId}"` : "";
      return `
        <details class="custom-select">
          <summary>${escapeHtml(selectedLabel)}</summary>
          <div class="custom-select-menu">
            ${childTypeGroups.map((group, groupIndex) => `
              ${group.map((value) => {
                const option = childTypeOptions.find((item) => item.value === value);
                if (!option) return "";
                return `
                  <button
                    type="button"
                    class="custom-select-option${option.value === selectedValue ? " is-selected" : ""}"
                    data-action="${action}"
                    data-section-id="${sectionId}"
                    ${attr}
                    data-value="${option.value}"
                  >${escapeHtml(option.label)}</button>
                `;
              }).join("")}
              ${groupIndex < childTypeGroups.length - 1 ? `<div class="custom-select-separator" aria-hidden="true"></div>` : ""}
            `).join("")}
          </div>
        </details>
      `;
    }

    function updateCustomSelectDirection(details) {
      if (!details) return;
      details.classList.remove("open-up");
      if (!details.open) return;

      const rect = details.getBoundingClientRect();
      const estimatedMenuHeight = 420;
      const spaceBelow = window.innerHeight - rect.bottom;
      const spaceAbove = rect.top;

      if (spaceBelow < estimatedMenuHeight && spaceAbove > spaceBelow) {
        details.classList.add("open-up");
      }
    }

    function closeCustomSelects(except = null) {
      sectionList.querySelectorAll("details.custom-select[open]").forEach((details) => {
        if (except && details === except) return;
        details.open = false;
        details.classList.remove("open-up");
      });
    }

    function findSection(sectionId) {
      return state.sections.find((section) => section.id === sectionId);
    }

    function findChild(sectionId, childId) {
      const section = findSection(sectionId);
      return section ? section.children.find((child) => child.id === childId) : null;
    }

    function findQaItem(sectionId, childId, qaId) {
      const child = findChild(sectionId, childId);
      return child && Array.isArray(child.qaItems)
        ? child.qaItems.find((item) => item.id === qaId)
        : null;
    }

    function findQuoteItem(sectionId, childId, quoteId) {
      const child = findChild(sectionId, childId);
      return child && Array.isArray(child.quoteItems)
        ? child.quoteItems.find((item) => item.id === quoteId)
        : null;
    }

    function findChoiceItem(sectionId, childId, choiceId) {
      const child = findChild(sectionId, childId);
      return child && Array.isArray(child.choiceItems)
        ? child.choiceItems.find((item) => item.id === choiceId)
        : null;
    }

    function findEndingItem(sectionId, childId, endingId) {
      const child = findChild(sectionId, childId);
      return child && Array.isArray(child.endingItems)
        ? child.endingItems.find((item) => item.id === endingId)
        : null;
    }

    function findExploreItem(sectionId, childId, exploreId) {
      const child = findChild(sectionId, childId);
      return child && Array.isArray(child.exploreItems)
        ? child.exploreItems.find((item) => item.id === exploreId)
        : null;
    }

    function findExploreDetailBlock(sectionId, childId, exploreId, detailId) {
      const item = findExploreItem(sectionId, childId, exploreId);
      return item && Array.isArray(item.detailBlocks)
        ? item.detailBlocks.find((block) => block.id === detailId)
        : null;
    }

    function findCharacterAttack(sectionId, childId, entryId, attackId) {
      const entry = findCharacterEntry(sectionId, childId, entryId);
      return entry && Array.isArray(entry.characterAttacks)
        ? entry.characterAttacks.find((item) => item.id === attackId)
        : null;
    }

    function findCharacterEntry(sectionId, childId, entryId) {
      const child = findChild(sectionId, childId);
      return child && Array.isArray(child.characterEntries)
        ? child.characterEntries.find((item) => item.id === entryId)
        : null;
    }

    function ensureCharacterEntries(child) {
      if (!Array.isArray(child.characterEntries)) {
        child.characterEntries = [];
      }

      if (child.characterEntries.length === 0) {
        const hasLegacyContent = Boolean(
          child.title ||
          child.body ||
          child.imageUrl ||
          child.characterStats?.attack ||
          child.characterAttacks?.length
        );

        const entry = createDefaultCharacterEntry();
        entry.name = child.title || "";
        entry.summary = child.body || "";
        entry.imageUrl = child.imageUrl || "";
        entry.characterStats = {
          ...createDefaultCharacterStats(),
          ...(child.characterStats || {})
        };
        entry.characterStatAddType = child.characterStatAddType || "str";
        entry.activeCharacterStats = Array.isArray(child.activeCharacterStats)
          ? [...child.activeCharacterStats]
          : characterStatOptions.map((item) => item.key);
        entry.characterStatsCollapsed = Boolean(child.characterStatsCollapsed);
        entry.characterAttacks = Array.isArray(child.characterAttacks)
          ? child.characterAttacks.map((item) => ({ id: item.id || uid(), name: item.name || "", damage: item.damage || "", note: item.note || "" }))
          : [];
        entry.characterAttacksCollapsed = Boolean(child.characterAttacksCollapsed);
        entry.characterImageCollapsed = Boolean(child.characterImageCollapsed);

        if (hasLegacyContent || child.type === "character") {
          child.characterEntries = [entry];
        }
      }

      child.characterEntries = child.characterEntries.map((entry) => ({
        ...createDefaultCharacterEntry(),
        ...entry,
        characterStats: {
          ...createDefaultCharacterStats(),
          ...(entry.characterStats || {})
        },
        activeCharacterStats: Array.isArray(entry.activeCharacterStats)
          ? entry.activeCharacterStats
          : characterStatOptions.map((item) => item.key),
        characterAttacks: Array.isArray(entry.characterAttacks)
          ? entry.characterAttacks.map((item) => ({ id: item.id || uid(), name: item.name || "", damage: item.damage || "", note: item.note || "" }))
          : []
      }));
    }

    function ensureCharacterAttackState(child) {
      if (!Array.isArray(child.characterAttacks)) {
        child.characterAttacks = [];
      }

      if (!child.characterAttacks.length && child.characterStats?.attack) {
        child.characterAttacks = child.characterStats.attack
          .split("\n")
          .map((line) => line.trim())
          .filter(Boolean)
          .map((line) => ({ id: uid(), name: line, damage: "", note: "" }));
      }
    }

    function readImageFile(file, onLoad) {
      if (!file || !file.type.startsWith("image/")) return;
      const reader = new FileReader();
      reader.onload = () => onLoad(String(reader.result || ""));
      reader.readAsDataURL(file);
    }

    function shouldShowNotesField(child) {
      return !["truth", "toc", "divider"].includes(child.type) && Boolean(child.showNotes);
    }

    const skillResultOptions = [
      { value: "success", label: "成功" },
      { value: "failure", label: "失敗" },
      { value: "critical", label: "クリティカル" },
      { value: "fumble", label: "ファンブル" }
    ];

    function skillResultLabel(key) {
      const found = skillResultOptions.find((item) => item.value === key);
      return found ? found.label : key;
    }

    function ensureSkillState(child) {
      if (!child.skillResults) {
        child.skillResults = createEmptySkillResults();
      }

      const derived = skillResultOptions
        .map((item) => item.value)
        .filter((key) => child.skillResults[key]);

      if (!Array.isArray(child.activeSkillResults)) {
        child.activeSkillResults = [];
      }

      if (child.activeSkillResults.length === 0 && derived.length > 0) {
        child.activeSkillResults = derived;
      }

      child.activeSkillResults = skillResultOptions
        .map((item) => item.value)
        .filter((key) => child.activeSkillResults.includes(key));

      const remaining = skillResultOptions
        .map((item) => item.value)
        .filter((key) => !child.activeSkillResults.includes(key));

      child.skillAddType = remaining.includes(child.skillAddType)
        ? child.skillAddType
        : (remaining[0] || skillResultOptions[0].value);
    }

    function ensureEndingState(child) {
      if (!Array.isArray(child.endingItems)) {
        child.endingItems = createDefaultEndingItems();
      }
      if (child.endingItems.length === 0) {
        child.endingItems = createDefaultEndingItems();
      }
      child.endingItems = child.endingItems.map((item) => ({
        id: item.id || uid(),
        title: item.title || "",
        body: item.body || "",

      }));
